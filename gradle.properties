org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Gradle retries a repository request only on a timeout, a 5xx or HTTP 429 (Gradle's NetworkingIssueVerifier). By default that
# is 3 tries, 1 s then 2 s apart, and a repository that still fails is disabled for the rest of the build ("Repository MavenRepo
# is disabled due to earlier error"). A 429 burst from Maven Central can outlast 6 tries (62 s of waits), and nightly fuzz legs still
# failed on one, so this sets 8 tries: waits of 2, 4, 8, 16, 32, 64 and 128 s, about four minutes in all.
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
