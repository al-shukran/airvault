name: gradle-lane
description: >-
  Runs scripts/ci/run-partition.sh lanes offline. Restores the dependency cache and the lane's build state (the project's
  build directories and Gradle's execution history) from the newest master run, so Gradle reruns only the tasks whose inputs
  the change touched and Kotlin compiles them incrementally. The job saves the state with ./.github/actions/gradle-lane/save, a step of its own, so the lane budget can leave the upload out.
inputs:
  lanes:
    description: The run-partition.sh lanes to run, space separated.
    required: true
  state:
    description: The build-state cache name of this lane. Empty restores and saves no build state.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: '21.0.13+9'

    - name: Restore the Gradle dependency cache
      id: deps
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.DEPS_CACHE_PATHS }}
        key: deps-v3-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}

    # A stalled download only warns, so one more try runs before the lane fails on a miss or an error.
    - name: Restore the Gradle dependency cache again when it was not restored
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.DEPS_CACHE_PATHS }}
        key: deps-v3-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}
        fail-on-cache-miss: true

    # Only master's entries: a pull request saves none, so its next run starts from master again, never from its own state.
    - name: Restore the build state of this lane
      if: inputs.state != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.BUILD_STATE_PATHS }}
        key: bs-${{ inputs.state }}-${{ env.BUILD_CACHE_SCOPE }}-${{ github.sha }}
        restore-keys: |
          bs-${{ inputs.state }}-master-

    # CI only, in the Gradle user home: Kotlin compiles inside the Gradle daemon instead of starting a Kotlin daemon per lane,
    # and the local build cache is off, because the build state replaces it and nothing would restore its entries.
    - name: Set the CI Gradle properties
      shell: bash
      run: printf '%s\n' kotlin.compiler.execution.strategy=in-process org.gradle.caching=false >> ~/.gradle/gradle.properties

    - name: Run ${{ inputs.lanes }}
      shell: bash
      env:
        LANES: ${{ inputs.lanes }}
      run: |
        for lane in $LANES; do
          ./scripts/ci/run-partition.sh "$lane"
        done

    # Only a push saves the state, and a running daemon could still be writing to it.
    - name: Stop the Gradle daemon so the state can be saved
      if: always() && github.event_name == 'push'
      shell: bash
      run: ./gradlew --stop
