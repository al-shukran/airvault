version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Version tracks the Robolectric test SDK level; bump manually with sdk changes.
      - dependency-name: "org.robolectric:android-all-instrumented"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
