name: cache-warm

# Guideline 2.3 assumes setup-gradle's Gradle user home cache is "saved on master, restored on
# PRs". In this repo the integration base is phase-1-5, not master, and nothing ran on push to
# either branch, so there was no base cache to restore: every new branch paid full compilation.
# That is what broke PR #63, where the first run of test (core-registry) was cancelled by the
# job's timeout-minutes: 3 on a cold cache, while warm runs of the same job take about 1m54s.
#
# This job compiles and resolves the dependencies the PR lane reads, so it fills the cache the PR lane
# restores. It is not a gate: a red run here never blocks a pull request.
#
# Two details make the warm cache actually reachable from a PR:
#   - setup-gradle writes cache entries only on the default branch (master) unless
#     cache-read-only is false, so the phase-1-5 leg sets it false. Without that, this job would
#     read and never save.
#   - A PR run restores entries from its base branch, so the phase-1-5 leg is what serves PRs
#     that target phase-1-5.
#   - setup-gradle keys the Gradle User Home entry by job id, and a PR restores only entries saved
#     under the same job id (the `test` job in pr-fast.yml). The job is therefore named `test`
#     here. Named `warm`, its entries were never read by PR test jobs, which kept restoring a
#     stale `test` entry from before this job existed.
on:
  push:
    branches: [master, phase-1-5]
  workflow_dispatch:

permissions:
  contents: read

# Runs are never cancelled. A run cancelled by a newer push is killed before setup-gradle saves its Gradle home (its post step logs
# no "Saved cache entry"), so the commit had no entry. 57 of 213 master runs from 2026-11-16 to 2026-11-18 were cancelled this way,
# and a PR restores the newest entry that was saved, which can predate a plugin or library version the PR needs. Pending runs
# still collapse to one: a queued run is replaced by a newer one.
concurrency:
  group: cache-warm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test: # the job id must match pr-fast.yml's `test` job (see above)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The default is read-only on any branch that is not the repository default, which
          # would leave phase-1-5 without a cache of its own.
          cache-read-only: false

      # Compile resolves only the compile classpaths. The test runtime classpaths (JUnit, Robolectric,
      # Roborazzi, ...) were never saved, so every PR test partition downloaded them from Maven Central at
      # once. Central answered that burst with HTTP 429 ("Could not GET ... Received status code 429"), and
      # the partition failed on the first one. One selector per module resolves each module's unit-test
      # runtime classpath; the selectors are small, and the downloads are what this step is for.
      - name: Resolve unit-test runtime classpaths
        run: >
          ./gradlew
          :shared:testDebugUnitTest --tests 'app.lensly.core.btc.*'
          :app:testDebugUnitTest --tests 'app.lensly.SmokeTest'
          :lumio:testDebugUnitTest --tests 'app.lumio.data.cache.*'

      # Compile every variant the PR lane compiles, and nothing else. Each task was confirmed
      # present with `./gradlew <tasks> --dry-run`. Keep this list in step with the build types
      # in app/build.gradle.kts and shared/build.gradle.kts and the modules in settings.gradle.kts.
      # The lumio tasks are here so the lumio partitions and lint restore compiled Lumio (main, KSP and
      # unit tests, about 50 s on a cold cache) and the APK job restores its dex step too.
      - name: Compile without tests
        run: >
          ./gradlew
          :shared:compileDebugKotlin
          :shared:compileDebugUnitTestKotlin
          :shared:compileDebugTestFixturesKotlin
          :shared:compileBenchmarkKotlin
          :app:compileDebugKotlin
          :app:compileDebugUnitTestKotlin
          :app:compileDebugAndroidTestKotlin
          :app:compileBenchmarkKotlin
          :app:compileBenchmarkAndroidTestKotlin
          :lumio:compileDebugUnitTestKotlin
          :lumio:assembleDebug
          :tools:registry-pack:testClasses

  # pr-fast.yml's `lint` job has its own Gradle User Home key, and nothing on master wrote it, so a PR's lint
  # started cold: 40 to 76 s of task-graph configuration, then every compile task of :shared and :lumio ran
  # instead of coming from the build cache. This job runs the same lint task so the key gets a master entry.
  lint: # the job id must match pr-fast.yml's `lint` job (see the note above)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      - name: Lint lumio
        run: ./gradlew :lumio:lintDebug
