name: cache-warm

# Warms the Gradle caches that the PR lane restores (guideline 2.3). This workflow is the only writer of the `test` entry on
# master and phase-1-5: the pr-fast partitions restore it and never save. It compiles and resolves, and runs one small test
# class per module, which only makes the test runtime jars available. It runs no full test set and no lint: pr-fast runs
# both on every push to master, and pr-fast's `lint` job writes the `lint` entry.
#
# Three details make the warm cache reachable from a PR:
#   - setup-gradle writes cache entries only on the default branch (master) unless cache-read-only is false, so the
#     phase-1-5 leg sets it false. Without that, this job would read and never save.
#   - A PR run restores entries from its base branch, so the phase-1-5 leg is what serves PRs that target phase-1-5.
#   - setup-gradle keys the Gradle User Home entry by job id, and a PR restores only entries saved under the same job id
#     (the `test` job in pr-fast.yml). The job is therefore named `test` here.
on:
  push:
    branches: [master, phase-1-5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-warm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test: # the job id must match pr-fast.yml's `test` job (see above)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The default is read-only on any branch that is not the repository default, which
          # would leave phase-1-5 without a cache of its own.
          cache-read-only: false

      # Test runtime jars (JUnit, Robolectric, Roborazzi, ...) are downloaded only when a test task runs. Central answered a
      # parallel burst of those downloads with HTTP 429, so they are fetched here, once, by one small test class per module.
      - name: Resolve unit-test runtime classpaths
        run: >
          ./gradlew
          :shared:testDebugUnitTest --tests 'app.lensly.core.solana.SolanaSignatureTest'
          :app:testDebugUnitTest --tests 'app.lensly.SmokeTest'
          :lumio:testDebugUnitTest --tests 'app.lumio.data.cache.*'

      # Compile every variant the PR lane compiles, and nothing else. Each task was confirmed
      # present with `./gradlew <tasks> --dry-run`. Keep this list in step with the build types
      # in app/build.gradle.kts and shared/build.gradle.kts and the modules in settings.gradle.kts.
      # The lumio tasks are here so the lumio partitions and lint restore compiled Lumio (main, KSP and
      # unit tests, about 50 s on a cold cache) and the APK job restores its dex step too.
      - name: Compile without tests
        run: >
          ./gradlew
          :shared:compileDebugKotlin
          :shared:compileDebugUnitTestKotlin
          :shared:compileDebugTestFixturesKotlin
          :shared:compileBenchmarkKotlin
          :app:compileDebugKotlin
          :app:compileDebugUnitTestKotlin
          :app:compileDebugAndroidTestKotlin
          :app:compileBenchmarkKotlin
          :app:compileBenchmarkAndroidTestKotlin
          :lumio:compileDebugUnitTestKotlin
          :lumio:assembleDebug
          :tools:registry-pack:testClasses
