name: dependency-graph

# dependency-review-action in the PR fast lane needs a submitted dependency graph to diff
# against. GitHub cannot read a Gradle graph without a submission, so this job submits one on
# every push to a long-lived branch. Without it, a PR that touches a dependency file fails
# with "Dependency review is not supported on this repository".
#
# The repository's dependency graph is currently disabled, and only an admin can enable it
# (Settings -> Code security). Submissions are allowed to fail so this workflow stays green
# and starts working the moment the setting is turned on.
on:
  push:
    branches: [master, phase-1-5]
  workflow_dispatch:

permissions:
  contents: write # required by the dependency submission API

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - id: submission
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        continue-on-error: true

      - name: Report skipped submission
        if: steps.submission.outcome == 'failure'
        run: |
          echo "::warning::Dependency graph submissions are skipped until a human enables Dependency graph: https://github.com/heyaibi/lensly/settings/security_analysis"
