name: release

# Signed GitHub releases for Lensly and Lumio. A tag push runs three stages in separate jobs, each on its own runner:
#   build    runs Gradle and every build dependency. It has no secrets and read-only permissions. It uploads the unsigned APK.
#   sign_*   the job of the tagged app only (sign_lensly or sign_lumio). It runs no Gradle, checks the APK against the hash the
#            build job reported, and signs it with that app's keystore from the `release` environment. Only a lensly-v* or
#            lumio-v* tag may read the environment's secrets, and each job reads one app's two secrets, never both apps'.
#   publish  has no secrets. It verifies the signed APK, attests its build provenance and creates the GitHub release.
# No other event runs this workflow, and no release is built or uploaded from a laptop. docs/releasing.md has the steps.
#
# lensly-v<versionName> builds :app (package app.lensly). lumio-v<versionName> builds :lumio (package app.lumio).

on:
  push:
    tags:
      - 'lensly-v*'
      - 'lumio-v*'

# Read-only by default. Each job below asks for what it needs.
permissions:
  contents: read

# Its own group per tag, never cancelled: a publish that started always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.stage.outputs.sha256 }}
    steps:
      # fetch-depth 0: versionCode is the commit count of HEAD (app/build.gradle.kts). A shallow clone would build code 1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Only a commit that reached master may be built and signed. Any pushed lensly-v*/lumio-v* tag runs this workflow, so a tag on
      # a commit off master must stop here.
      - name: Refuse a tag whose commit is not on master
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of master. Only master commits are released."
            exit 1
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # A signed release builds from a clean state: never restore a cache another run wrote.
          cache-disabled: true

      - name: Resolve the app and version from the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            lensly-v*) app=lensly; module=app ;;
            lumio-v*) app=lumio; module=lumio ;;
            *) echo "::error::Tag $TAG is neither lensly-v<version> nor lumio-v<version>."; exit 1 ;;
          esac
          version="${TAG#"$app"-v}"
          # The tag must name the versionName the module builds, so the release and the APK carry the same version.
          module_version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' "$module/build.gradle.kts")
          if [ "$module_version" != "$version" ]; then
            echo "::error::Tag $TAG names version $version, but $module/build.gradle.kts has versionName \"$module_version\"."
            exit 1
          fi
          {
            echo "app=$app"
            echo "module=$module"
          } >> "$GITHUB_OUTPUT"

      # The release build type has no signingConfig, so this APK is unsigned. The sign job signs it.
      - name: Build the release APK with R8
        env:
          MODULE: ${{ steps.tag.outputs.module }}
        run: ./gradlew ":$MODULE:assembleRelease"

      # The hash is an output of this job, which the sign job compares with the artifact it downloads.
      - name: Stage the unsigned APK
        id: stage
        env:
          APP: ${{ steps.tag.outputs.app }}
          MODULE: ${{ steps.tag.outputs.module }}
        run: |
          set -euo pipefail
          unsigned="$MODULE/build/outputs/apk/release/$MODULE-release-unsigned.apk"
          if [ ! -f "$unsigned" ]; then
            echo "::error::The release build produced no $unsigned."
            exit 1
          fi
          mkdir unsigned
          cp "$unsigned" "unsigned/$APP.apk"
          echo "sha256=$(sha256sum "unsigned/$APP.apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: unsigned/
          if-no-files-found: error
          retention-days: 3

  sign_lensly:
    name: sign lensly
    needs: build
    if: startsWith(github.ref_name, 'lensly-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that reads the lensly keystore. The environment `release` allows the tags lensly-v* and lumio-v* only.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse a tag whose commit is not on master
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of master. Only master commits are released."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: unsigned

      # scripts/ci/sign-release.sh checks the hash and the version code, then aligns and signs.
      - name: Check, align and sign the APK
        env:
          APP: lensly
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          KEYSTORE_B64: ${{ secrets.LENSLY_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.LENSLY_KEYSTORE_PASS }}
        run: bash scripts/ci/sign-release.sh

      - name: Delete the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk
          path: signed/
          if-no-files-found: error
          retention-days: 3

  sign_lumio:
    name: sign lumio
    needs: build
    if: startsWith(github.ref_name, 'lumio-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that reads the lumio keystore. The environment `release` allows the tags lensly-v* and lumio-v* only.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse a tag whose commit is not on master
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of master. Only master commits are released."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: unsigned

      # scripts/ci/sign-release.sh checks the hash and the version code, then aligns and signs.
      - name: Check, align and sign the APK
        env:
          APP: lumio
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          KEYSTORE_B64: ${{ secrets.LUMIO_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.LUMIO_KEYSTORE_PASS }}
        run: bash scripts/ci/sign-release.sh

      - name: Delete the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk
          path: signed/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: publish ${{ github.ref_name }}
    needs: [sign_lensly, sign_lumio]
    # One sign job runs and the other is skipped, so a plain `needs` would skip this job too.
    if: ${{ !cancelled() && (needs.sign_lensly.result == 'success' || needs.sign_lumio.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-apk
          path: signed

      - name: Resolve the app and version from the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          app="${TAG%%-v*}"
          version="${TAG#"$app"-v}"
          # A 0.x version, or one with a suffix such as -rc.1, is a prerelease.
          case "$version" in
            0.* | *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          # The newest build-tools on the runner image provide zipalign, apksigner and aapt2.
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          if [ -z "$build_tools" ]; then
            echo "::error::No Android build-tools under $ANDROID_HOME."
            exit 1
          fi
          mkdir dist
          mv "signed/$app.apk" "dist/$app-v$version.apk"
          {
            echo "app=$app"
            echo "prerelease=$prerelease"
            echo "apk=$app-v$version.apk"
          } >> "$GITHUB_OUTPUT"
          echo "BUILD_TOOLS=$build_tools" >> "$GITHUB_ENV"

      - name: Verify the signature and the permissions
        env:
          APP: ${{ steps.tag.outputs.app }}
          APK: ${{ steps.tag.outputs.apk }}
        run: |
          set -euo pipefail
          apk="dist/$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$apk"
          # apksigner checks the v2 block only below API 28, where v3 takes over. Verifying from API 24 makes it check v2 too.
          verify=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs --min-sdk-version 24 "$apk")
          echo "$verify"
          grep -Eq '^Verified using v2 scheme .*: true$' <<<"$verify" \
            || { echo "::error::$APK is not signed with the v2 scheme."; exit 1; }
          grep -Eq '^Verified using v3 scheme .*: true$' <<<"$verify" \
            || { echo "::error::$APK is not signed with the v3 scheme."; exit 1; }
          # Older apksigner prints "Signer #1 certificate ...", newer prints one "V<scheme> Signer: certificate ..." line per scheme.
          # Every scheme must name the same single certificate.
          cert=$(sed -n -E 's/^(Signer #1|V[0-9.]+ Signer:) certificate SHA-256 digest: //p' <<<"$verify" | sort -u)
          if [ -z "$cert" ] || [ "$(wc -l <<<"$cert")" -ne 1 ]; then
            echo "::error::apksigner printed no single signing certificate digest for $APK."
            exit 1
          fi
          echo "CERT_SHA256=$cert" >> "$GITHUB_ENV"
          if [ "$APP" = lensly ]; then
            permissions=$("$BUILD_TOOLS/aapt2" dump permissions "$apk")
            for permission in android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE; do
              if grep -Fq "name='$permission'" <<<"$permissions"; then
                echo "::error::Lensly is an offline vault and must not request $permission."
                exit 1
              fi
            done
          fi

      - name: Write SHA256SUMS
        env:
          APK: ${{ steps.tag.outputs.apk }}
        run: (cd dist && sha256sum "$APK" > SHA256SUMS)

      - name: Attest the APK's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ steps.tag.outputs.apk }}

      - name: Add the changelog section to the release notes
        env:
          TAG: ${{ github.ref_name }}
          APP: ${{ steps.tag.outputs.app }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          app = os.environ["APP"]
          version = os.environ["TAG"].split("-v", 1)[-1]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              print(f"prerelease {version}: no changelog section expected")
              raise SystemExit(0)
          text = Path(f"CHANGELOG-{app}.md").read_text()
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          if match is None:
              raise SystemExit(f"CHANGELOG-{app}.md has no [{version}] section")
          section = match.group(1).strip()
          if not any(line.startswith("- ") for line in section.splitlines()):
              raise SystemExit(f"CHANGELOG-{app}.md [{version}] has no entries")
          notes = Path(f".github/release-notes/{app}.md")
          body = notes.read_text()
          marker = "## How to Verify This Release"
          if marker not in body:
              raise SystemExit(f"{notes} has no {marker} heading")
          head, tail = body.split(marker, 1)
          notes.write_text(
              head.rstrip() + "\n\n" + f"## Changes in {version}\n\n" + section + "\n\n" + marker + tail
          )
          print(f"added [{version}] from CHANGELOG-{app}.md to {notes}")
          PY

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          APP: ${{ steps.tag.outputs.app }}
          APK: ${{ steps.tag.outputs.apk }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          apk_sha=$(sha256sum "dist/$APK" | cut -d' ' -f1)
          notes="$RUNNER_TEMP/notes.md"
          cp ".github/release-notes/$APP.md" "$notes"
          cat >> "$notes" <<EOF

          ## Build

          - APK: \`$APK\`
          - APK SHA-256: \`$apk_sha\`
          - Signing certificate SHA-256: \`$CERT_SHA256\`
          - Source commit: \`$GITHUB_SHA\`
          EOF
          args=(--title "${APP^} ${TAG#*-v}" --notes-file "$notes")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" "dist/$APK" dist/SHA256SUMS "${args[@]}"
