name: cache-cleanup

# A pull request's build caches are scoped to refs/pull/<number>/merge, which no other branch can restore. Delete them when the
# pull request closes so they stop counting against the repository's 10 GB cache limit.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete-pr-caches:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete the caches of this pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref refs/pull/${{ github.event.pull_request.number }}/merge --limit 100 --json id --jq '.[].id' \
            | xargs -r -n1 gh cache delete
