name: pr-fast

# Guideline docs/testing/guideline.md 2.1-2.4. Every job has a 3-minute cap: a pull request's verification, from its first job
# queued to pr-ok done, must fit in 3 minutes. `pr-ok` is the single required check. A push to master runs the same jobs for
# every partition (guideline 2.4), so a broken merge shows on the merge commit.
on:
  pull_request:
    branches: [master, phase-1-5]
  push:
    branches: [master]

permissions:
  contents: read

# A pull request supersedes its own earlier run. Pushes to master are never cancelled, so each merge commit is verified.
concurrency:
  group: pr-fast-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists PR files through the API
    outputs:
      partitions: ${{ steps.plan.outputs.partitions }}
      lint: ${{ steps.plan.outputs.lint }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Path filters for guideline 2.2. The areas are coarse on purpose: a change to :shared runs the :app and :lumio shards
      # too, and a change to core/ or chains/ (which :shared is built from) counts as a :shared change. A push has no filter
      # and runs every partition.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared:
              - 'shared/**'
              - 'core/**'
              - 'chains/**'
            app:
              - 'app/**'
            lumio:
              - 'lumio/**'
            registry:
              - 'tools/registry-pack/**'
            manifest:
              - '**/src/**/AndroidManifest.xml'
              - '**/*.gradle.kts'
              - 'gradle/libs.versions.toml'
              - 'scripts/ci/check-manifest.sh'
            build:
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
            ci:
              - 'scripts/ci/**'
              - '.github/workflows/pr-fast.yml'
              - '.github/workflows/cache-warm.yml'
              - '.gitleaks.toml'
            dependencies:
              - 'build.gradle.kts'
              - 'app/build.gradle.kts'
              - 'lumio/build.gradle.kts'
              - 'shared/build.gradle.kts'
              - 'tools/*/build.gradle.kts'
              - 'gradle/libs.versions.toml'
              - 'gradle/wrapper/**'
              - 'gradle.properties'
              - 'settings.gradle.kts'

      # scripts/ci/plan-partitions.sh turns the flags into the test matrix (the shards come from scripts/ci/shards.sh).
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SHARED: ${{ steps.filter.outputs.shared }}
          APP: ${{ steps.filter.outputs.app }}
          LUMIO: ${{ steps.filter.outputs.lumio }}
          REGISTRY: ${{ steps.filter.outputs.registry }}
          MANIFEST: ${{ steps.filter.outputs.manifest }}
          BUILD: ${{ steps.filter.outputs.build }}
          CI_CHANGED: ${{ steps.filter.outputs.ci }}
        run: scripts/ci/plan-partitions.sh

  # One matrix entry per partition from plan-partitions.sh. A partition is one Gradle invocation or one script. The `ci`
  # entry runs no Gradle, so it skips the setup steps.
  test:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.partitions != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(needs.changes.outputs.partitions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.partition != 'ci'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      # Read-only on every event. cache-warm.yml is the only writer of the `test` entry (setup-gradle keys entries by job
      # id), so 13 partitions never write 13 partial copies of it.
      - if: matrix.partition != 'ci'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # The configuration cache lives under .gradle/, which setup-gradle does not save. Restoring it skips the ~70 s of
      # configuration per partition. Each partition's entry is saved by master pushes only (the step below).
      - if: matrix.partition != 'ci'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/configuration-cache
          key: configuration-${{ matrix.partition }}-${{ github.run_id }}
          restore-keys: configuration-${{ matrix.partition }}-

      - name: Run ${{ matrix.partition }}
        run: scripts/ci/run-partition.sh "${{ matrix.partition }}"

      # Lensly (:app) is offline in release too. check-manifest.sh reads only the debug merge, so the release merge is read
      # here, in the manifest partition. Lumio (the companion) may request INTERNET, so only :app is checked.
      - name: Refuse INTERNET in the release manifest of :app
        if: matrix.partition == 'manifest'
        run: |
          ./gradlew :app:processReleaseMainManifest
          merged="$(find app/build/intermediates -path '*merged_manifest*/release/*' -name AndroidManifest.xml | head -n 1)"
          if [ -z "$merged" ]; then
            echo "error: merged release manifest of :app not found under app/build/intermediates" >&2
            exit 1
          fi
          if grep -q '"android.permission.INTERNET"' "$merged"; then
            echo "error: android.permission.INTERNET is in the merged release manifest of :app; Lensly is offline by design" >&2
            exit 1
          fi
          echo "ok: the merged release manifest of :app has no android.permission.INTERNET"

      # R56: web3j brings OkHttp, the HTTP client, and shared excludes it from web3j. :app never calls it. This fails if a dependency
      # change puts OkHttp back on the release runtime classpath of :app.
      - name: Refuse OkHttp on the release runtime classpath of :app
        if: matrix.partition == 'manifest'
        run: |
          deps="$(./gradlew :app:dependencies --configuration releaseRuntimeClasspath -q)"
          if printf '%s\n' "$deps" | grep -q 'com\.squareup\.okhttp3'; then
            echo "error: OkHttp is on the release runtime classpath of :app; Lensly is offline by design (see shared/build.gradle.kts)" >&2
            exit 1
          fi
          echo "ok: no OkHttp on the release runtime classpath of :app"

      - name: Save the configuration cache
        if: always() && github.event_name == 'push' && matrix.partition != 'ci'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/configuration-cache
          key: configuration-${{ matrix.partition }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Lumio's lint is its own job, not a matrix entry, because setup-gradle keys its cache entry by job id: lint keeps the `lint`
  # entry that a master push writes. Lint runs for shared and lumio changes (lumio depends on shared). It takes about 2 minutes
  # warm; lumio/build.gradle.kts turns off the test-source and dependency checks that made it 3.5 minutes.
  lint:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      # Written on master pushes only (guideline 2.3); the save takes about 7 s there.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/configuration-cache
          key: configuration-lint-${{ github.run_id }}
          restore-keys: configuration-lint-

      - name: Lint lumio
        run: scripts/ci/run-partition.sh lint

      - name: Save the configuration cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/configuration-cache
          key: configuration-lint-${{ github.run_id }}-${{ github.run_attempt }}

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks CLI v8.30.0 instead of gitleaks-action: the action v3 requires a license key for
      # organization repositories (GITLEAKS_LICENSE), and this repository has none. The tarball is
      # checked against the SHA-256 published with the release before it runs.
      # The range is the PR's commit range, or the pushed commits on master, so only changed content is checked.
      # .gitleaks.toml keeps the default rules and allowlists shared/src/test/resources/vectors.
      - name: Scan commits for secrets
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          # A push that creates a branch has no earlier commit (before is all zeros): scan the pushed commit only.
          if [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            log_opts=-1
          else
            log_opts="${BASE_SHA}..${HEAD_SHA}"
          fi
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact \
            --log-opts="$log_opts" --exit-code 1 .

  dependency_review:
    # Snapshot comes from dependency-graph.yml, which submits on pushes to master and phase-1-5.
    #
    # The repository's Dependency graph is off, and only an admin can turn it on
    # (Settings -> Code security). While it is off the action cannot diff anything and fails with
    # "Dependency review is not supported on this repository" on every dependency PR. To enable:
    # turn on Dependency graph, then set the repository variable DEPENDENCY_GRAPH_ENABLED=true.
    # Until both are done the job skips, which raises no annotation and counts as a pass in pr-ok.
    #
    # No continue-on-error on purpose. The `if` is the whole fix: a skipped job never runs the
    # action, so the unsupported-repository error cannot appear. continue-on-error would instead
    # report a genuine high-severity finding as success once the graph is on, which disarms 1.8.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.dependencies == 'true' && vars.DEPENDENCY_GRAPH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  test_network:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Guideline 3: test code must not reference java.net., HttpURLConnection, or URL(.
      - run: ./scripts/ci/check-test-network.sh

  pr-ok: # the single required check
    if: always()
    needs: [changes, test, lint, secrets, dependency_review, test_network]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Aggregate results
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          LINT: ${{ needs.lint.result }}
          SECRETS: ${{ needs.secrets.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
          TEST_NETWORK: ${{ needs.test_network.result }}
        run: |
          printf 'changes=%s test=%s lint=%s secrets=%s dependency_review=%s test_network=%s\n' \
            "$CHANGES" "$TEST" "$LINT" "$SECRETS" "$DEPENDENCY_REVIEW" "$TEST_NETWORK"
          # test, lint and dependency review are skipped when nothing in their area changed, and dependency review
          # is skipped on master pushes and whenever DEPENDENCY_GRAPH_ENABLED is not 'true'. A skip counts as a pass.
          case "$TEST" in
            success | skipped) ;;
            *) echo "test partition failed or was cancelled"; exit 1 ;;
          esac
          case "$LINT" in
            success | skipped) ;;
            *) echo "lumio lint failed or was cancelled"; exit 1 ;;
          esac
          case "$DEPENDENCY_REVIEW" in
            success | skipped) ;;
            *) echo "dependency review failed"; exit 1 ;;
          esac
          for result in "$CHANGES" "$SECRETS" "$TEST_NETWORK"; do
            [ "$result" = success ] || { echo "a required job did not succeed"; exit 1; }
          done
