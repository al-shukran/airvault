name: pr-fast

# One gate for pull requests, the merge queue and master. Every event runs the same lanes (scripts/ci/README.md), so a change
# verified on its pull request is the change master builds after it lands. `pr-ok` is the single required check.
#
# Gradle runs offline in every job except `deps`. `deps` fills the Gradle module cache once per dependency key, with
# `./gradlew resolveAll`, and the other jobs restore that exact key. A missing artifact then fails by name, not by a network
# fetch, so a red run is never a dependency flake.
on:
  pull_request:
    branches: [master, phase-1-5]
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]

permissions:
  contents: read

# The build cache has a scope per run. A pull request saves and restores `pr<number>` entries, which GitHub keeps out of master
# and out of every other pull request, so no pull request can change what master restores. A push to master and a queue entry
# use `master`, the entries that pull requests fall back to. Every lane saves its entry, even when it fails or is cancelled, so
# the next run can restore what this run built.
env:
  BUILD_CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr{0}', github.event.pull_request.number) || 'master' }}
  # Gradle encrypts configuration-cache entries with this key. Without a shared key, each runner's own keystore encrypts them, so
  # no lane can read an entry another lane saved. The repository secret must exist for this to take effect (see the PR body).
  GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

# A pull request supersedes its own earlier run. A master push or a queue entry always finishes: each commit that lands is
# verified.
concurrency:
  group: pr-fast-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one job that may use the network for dependencies. A cache hit on the key skips it. The key covers the files that decide
  # what Gradle resolves, so a dependency change always makes a new key. A miss can take three attempts of resolveAll
  # (scripts/ci/run-partition.sh online), so this job has 10 minutes where the other lanes have 5.
  deps:
    name: resolve dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      # cache-disabled: setup-gradle's own cache entries were the poisoned ones (its cleanup purged plugin marker POMs). The
      # dependency and build caches below replace them.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # dependencies-accessors holds the version-catalog classes Gradle generates. The configuration cache records them as inputs,
      # so a restore without them reads every entry as "has been removed" and each lane configures from scratch. The version in
      # the path is the one gradle-wrapper.properties pins.
      - name: Restore the Gradle dependency cache
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/9.7.0/dependencies-accessors
          key: deps-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}

      - name: Resolve every configuration (online, on a cache miss only)
        if: steps.deps.outputs.cache-hit != 'true'
        run: ./scripts/ci/run-partition.sh resolve

  # The unit tests of :app, :lumio, :shared and the pure JVM modules, in six balanced lanes (scripts/ci/shards.txt).
  shard:
    name: shard ${{ matrix.shard }}
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Restore the Gradle dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/9.7.0/dependencies-accessors
          key: deps-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}
          fail-on-cache-miss: true

      # The build cache and the configuration cache of this lane: this run's scope first, then master's.
      - name: Restore the Gradle build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            .gradle/configuration-cache
          key: bc-shard-${{ matrix.shard }}-${{ env.BUILD_CACHE_SCOPE }}-${{ github.sha }}
          restore-keys: |
            bc-shard-${{ matrix.shard }}-${{ env.BUILD_CACHE_SCOPE }}-
            bc-shard-${{ matrix.shard }}-master-

      - name: Run shard-${{ matrix.shard }}
        run: ./scripts/ci/run-partition.sh shard-${{ matrix.shard }}

      - name: Stop the Gradle daemon before the cache is saved
        if: always()
        run: ./gradlew --stop

      - name: Save the Gradle build cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            .gradle/configuration-cache
          key: bc-shard-${{ matrix.shard }}-${{ env.BUILD_CACHE_SCOPE }}-${{ github.sha }}

      - name: Upload the JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-shard-${{ matrix.shard }}
          path: '**/build/test-results/**/*.xml'
          retention-days: 3
          if-no-files-found: ignore

  # Roborazzi pixel tests of :app and :lumio, verified against the committed PNGs (guideline 2.7).
  roborazzi:
    name: verify screenshots
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Restore the Gradle dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/9.7.0/dependencies-accessors
          key: deps-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}
          fail-on-cache-miss: true

      - name: Restore the Gradle build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            .gradle/configuration-cache
          key: bc-verify-${{ env.BUILD_CACHE_SCOPE }}-${{ github.sha }}
          restore-keys: |
            bc-verify-${{ env.BUILD_CACHE_SCOPE }}-
            bc-verify-master-

      - name: Verify screenshots
        run: ./scripts/ci/run-partition.sh verify

      - name: Stop the Gradle daemon before the cache is saved
        if: always()
        run: ./gradlew --stop

      - name: Save the Gradle build cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            .gradle/configuration-cache
          key: bc-verify-${{ env.BUILD_CACHE_SCOPE }}-${{ github.sha }}

      - name: Upload the JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-verify
          path: '**/build/test-results/**/*.xml'
          retention-days: 3
          if-no-files-found: ignore

  # The Jazzer seed replays (app.lensly.fuzz.*). They run in their own JVM, so they are not in a shard.
  fuzz:
    name: fuzz replay
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Restore the Gradle dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/9.7.0/dependencies-accessors
          key: deps-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}
          fail-on-cache-miss: true

      - name: Restore the Gradle build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            .gradle/configuration-cache
          key: bc-fuzz-${{ env.BUILD_CACHE_SCOPE }}-${{ github.sha }}
          restore-keys: |
            bc-fuzz-${{ env.BUILD_CACHE_SCOPE }}-
            bc-fuzz-master-

      - name: Replay the fuzz seeds
        run: ./scripts/ci/run-partition.sh fuzz

      - name: Stop the Gradle daemon before the cache is saved
        if: always()
        run: ./gradlew --stop

      - name: Save the Gradle build cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            .gradle/configuration-cache
          key: bc-fuzz-${{ env.BUILD_CACHE_SCOPE }}-${{ github.sha }}

  # Compiles the androidTest and benchmark sources, which no test lane runs, and assembles the Lumio debug APK.
  android:
    name: compile androidTest and benchmark
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Restore the Gradle dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/9.7.0/dependencies-accessors
          key: deps-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}
          fail-on-cache-miss: true

      - name: Restore the Gradle build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            .gradle/configuration-cache
          key: bc-android-${{ env.BUILD_CACHE_SCOPE }}-${{ github.sha }}
          restore-keys: |
            bc-android-${{ env.BUILD_CACHE_SCOPE }}-
            bc-android-master-

      - name: Compile androidTest, benchmark and the Lumio APK
        run: ./scripts/ci/run-partition.sh android

      - name: Stop the Gradle daemon before the cache is saved
        if: always()
        run: ./gradlew --stop

      - name: Save the Gradle build cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            .gradle/configuration-cache
          key: bc-android-${{ env.BUILD_CACHE_SCOPE }}-${{ github.sha }}

  lint:
    name: lint
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Restore the Gradle dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/9.7.0/dependencies-accessors
          key: deps-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}
          fail-on-cache-miss: true

      - name: Restore the Gradle build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            .gradle/configuration-cache
          key: bc-lint-${{ env.BUILD_CACHE_SCOPE }}-${{ github.sha }}
          restore-keys: |
            bc-lint-${{ env.BUILD_CACHE_SCOPE }}-
            bc-lint-master-

      - name: Lint every module
        run: ./scripts/ci/run-partition.sh lint

      - name: Stop the Gradle daemon before the cache is saved
        if: always()
        run: ./gradlew --stop

      - name: Save the Gradle build cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            .gradle/configuration-cache
          key: bc-lint-${{ env.BUILD_CACHE_SCOPE }}-${{ github.sha }}

  # Guideline 1.8 and R56. The merged manifests and the OkHttp check (scripts/ci/run-partition.sh manifest).
  manifest:
    name: manifest guards
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Restore the Gradle dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/9.7.0/dependencies-accessors
          key: deps-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}
          fail-on-cache-miss: true

      - name: Check the merged manifests
        run: ./scripts/ci/run-partition.sh manifest

  # No Gradle: every script's syntax, the test-class coverage of the lanes, and the test-network guard (guideline 3).
  ci:
    name: ci scripts and test coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check CI scripts, test coverage and the network guard
        run: ./scripts/ci/run-partition.sh ci

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks CLI v8.30.0 instead of gitleaks-action: the action v3 requires a license key for organization repositories
      # (GITLEAKS_LICENSE), and this repository has none. The tarball is checked against the SHA-256 published with the release.
      # The range is the commit range of the event (the pull request, the queue entry or the push), so only changed content is checked.
      # .gitleaks.toml keeps the default rules and allowlists shared/src/test/resources/vectors.
      - name: Scan the commits of the event for secrets
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" --exit-code 1 .

  dependency_review:
    # Snapshot comes from dependency-graph.yml, which submits on pushes to master and phase-1-5.
    #
    # The repository's Dependency graph is off, and only an admin can turn it on (Settings -> Code security). While it is off
    # the action cannot diff anything and fails with "Dependency review is not supported on this repository". To enable: turn on
    # Dependency graph, then set the repository variable DEPENDENCY_GRAPH_ENABLED=true. Until both are done the job skips, which
    # counts as a pass in pr-ok. The action reads pull requests only, so the merge queue and master skip it too.
    #
    # No continue-on-error on purpose: a genuine high-severity finding must fail the check once the graph is on.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_GRAPH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  pr-ok: # the single required check
    if: always()
    needs: [deps, shard, roborazzi, fuzz, android, lint, manifest, ci, secrets, dependency_review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEPS: ${{ needs.deps.result }}
      SHARD: ${{ needs.shard.result }}
      ROBORAZZI: ${{ needs.roborazzi.result }}
      FUZZ: ${{ needs.fuzz.result }}
      ANDROID: ${{ needs.android.result }}
      LINT: ${{ needs.lint.result }}
      MANIFEST: ${{ needs.manifest.result }}
      CI: ${{ needs.ci.result }}
      SECRETS: ${{ needs.secrets.result }}
      DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
      DEPENDENCY_GRAPH_ENABLED: ${{ vars.DEPENDENCY_GRAPH_ENABLED }}
    steps:
      - name: Aggregate results
        run: |
          failed=0
          for pair in "deps=$DEPS" "shard=$SHARD" "roborazzi=$ROBORAZZI" "fuzz=$FUZZ" "android=$ANDROID" \
                      "lint=$LINT" "manifest=$MANIFEST" "ci=$CI" "secrets=$SECRETS"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" != success ]; then
              echo "$name: $result"
              failed=1
            fi
          done
          # Dependency review is skipped until DEPENDENCY_GRAPH_ENABLED is set, and it is skipped on the queue and on master.
          case "$DEPENDENCY_REVIEW" in
            success) ;;
            skipped) [ "$DEPENDENCY_GRAPH_ENABLED" != true ] || [ "$GITHUB_EVENT_NAME" != pull_request ] || { echo "dependency_review: skipped"; failed=1; } ;;
            *) echo "dependency_review: $DEPENDENCY_REVIEW"; failed=1 ;;
          esac
          if [ "$failed" -ne 0 ]; then
            echo "pr-ok: a required lane did not succeed"
            exit 1
          fi
          echo "pr-ok: every lane succeeded"
