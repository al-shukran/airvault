name: pr-fast

# The blocking set for pull requests, the merge queue and master. Each lane here finishes in about 3 minutes or less, p90, and
# holds a security or guard check (scripts/ci/README.md). `pr-ok` is the single required check and needs deps, ci (the guards,
# with the mnemonic check), secrets (gitleaks), manifest (the no-INTERNET guard) and dependency_review. Unit-test shards, lint,
# screenshot goldens, fuzz seed replays and the APK compile run in nightly.yml on a schedule and on master pushes. They are
# slower than 3 minutes, so they never block a pull request.
#
# Gradle runs offline in every job except `deps`. `deps` fills the Gradle module cache once per dependency key, with
# `./gradlew resolveAll`, and the other jobs restore that exact key. A missing artifact then fails by name, not by a network
# fetch, so a red run is never a dependency flake.
on:
  pull_request:
    branches: [master, phase-1-5]
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]

permissions:
  contents: read

# Each lane has one build-cache key, and master replaces it on every push: GitHub cache entries are immutable, so a push deletes
# the key before it saves. A pull request and a merge-queue entry restore master's entry and save nothing. GitHub evicts the
# least recently used entries past the repository's 10 GB limit (scripts/ci/README.md).
env:
  # Gradle encrypts configuration-cache entries with this key. Without a shared key, each runner's own keystore encrypts them, so
  # no lane can read an entry another lane saved. The repository secret must exist for this to take effect (see the PR body).
  GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
  # The Gradle user-home directories the deps cache holds. The configuration cache names the generated ones (version-catalog
  # accessors, transformed and instrumented jars, compiled build scripts) as inputs, so a restore must bring them back too.
  # The directory names carry the Gradle version that gradle-wrapper.properties pins (9.7.0).
  DEPS_CACHE_PATHS: |
    ~/.gradle/caches/modules-2
    ~/.gradle/wrapper/dists
    ~/.gradle/caches/9.7.0/dependencies-accessors
    ~/.gradle/caches/9.7.0/generated-gradle-jars
    ~/.gradle/caches/9.7.0/kotlin-dsl
    ~/.gradle/caches/9.7.0/scripts
    ~/.gradle/caches/9.7.0/transforms
    ~/.gradle/caches/jars-9

# A pull request supersedes its own earlier run. Master pushes share one group and queue, never cancel: a running push always
# finishes, so no two runs replace a build cache at once. A push that waits behind a newer one is replaced by it, and the newer
# commit contains it and is verified. A queue entry always finishes.
concurrency:
  group: pr-fast-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'master' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one job that may use the network for dependencies. A cache hit on the key skips it. The key covers the files that decide
  # what Gradle resolves, so a dependency change always makes a new key. A miss can take three attempts of resolveAll
  # (scripts/ci/run-partition.sh online), so this job has 10 minutes where the other lanes have 5.
  deps:
    name: resolve dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      # cache-disabled: setup-gradle's own cache entries were the poisoned ones (its cleanup purged plugin marker POMs). The
      # dependency and build caches below replace them.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # The paths are DEPS_CACHE_PATHS (top of this file). Every job saves and restores that one list.
      - name: Restore the Gradle dependency cache
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_CACHE_PATHS }}
          key: deps-v3-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}

      - name: Resolve every configuration (online, on a cache miss only)
        if: steps.deps.outputs.cache-hit != 'true'
        run: ./scripts/ci/run-partition.sh resolve

  # No Gradle: every script's syntax, the test-class coverage of the lanes, and the test-network guard (guideline 3).
  ci:
    name: ci scripts and test coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check CI scripts, test coverage and the network guard
        run: ./scripts/ci/run-partition.sh ci

      # No BIP39 mnemonic outside the published vectors (scripts/ci/check-mnemonics.sh, scripts/ci/README.md).
      - name: Check for private mnemonics
        run: scripts/ci/check-mnemonics.sh

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks CLI v8.30.0 instead of gitleaks-action: the action v3 requires a license key for organization repositories
      # (GITLEAKS_LICENSE), and this repository has none. The tarball is checked against the SHA-256 published with the release.
      # The range is the commit range of the event (the pull request, the queue entry or the push), so only changed content is checked.
      # .gitleaks.toml keeps the default rules and allowlists shared/src/test/resources/vectors.
      - name: Scan the commits of the event for secrets
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" --exit-code 1 .

  # Guideline 1.8 and R56. The merged manifests and the OkHttp check (scripts/ci/run-partition.sh manifest).
  manifest:
    name: manifest guards
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Restore the Gradle dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_CACHE_PATHS }}
          key: deps-v3-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}
          fail-on-cache-miss: true

      - name: Check the merged manifests
        run: ./scripts/ci/run-partition.sh manifest

  dependency_review:
    # Snapshot comes from dependency-graph.yml, which submits on pushes to master and phase-1-5.
    #
    # Enabling it takes two steps: turn on Dependency graph (Settings -> Code security, admin only), then set the repository
    # variable DEPENDENCY_GRAPH_ENABLED=true. Without the graph the action cannot diff anything and fails with "Dependency review
    # is not supported on this repository". Until the variable is true the job skips, which counts as a pass in pr-ok. The
    # action reads pull requests only, so the merge queue and master skip it too.
    #
    # No continue-on-error on purpose: a genuine high-severity finding must fail the check once the graph is on.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_GRAPH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  pr-ok: # the single required check
    if: always()
    needs: [deps, ci, secrets, manifest, dependency_review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # the lane times of this run
      contents: read
      issues: write # the ci-budget issue, on a push to master
    env:
      DEPS: ${{ needs.deps.result }}
      CI: ${{ needs.ci.result }}
      SECRETS: ${{ needs.secrets.result }}
      MANIFEST: ${{ needs.manifest.result }}
      DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
      DEPENDENCY_GRAPH_ENABLED: ${{ vars.DEPENDENCY_GRAPH_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      # The machine-enforced lane budget (scripts/ci/lane-budget.sh, 3 minutes). It reports, and on master files an issue; it never
      # fails the gate, so a slow lane is fixed in a pull request, not rerun to green.
      - name: Check the lane budget
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FILE_ISSUE: ${{ github.event_name == 'push' }}
        run: scripts/ci/lane-budget.sh

      - name: Aggregate results
        run: |
          failed=0
          for pair in "deps=$DEPS" "ci=$CI" "secrets=$SECRETS" "manifest=$MANIFEST"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" != success ]; then
              echo "$name: $result"
              failed=1
            fi
          done
          # Dependency review is skipped until DEPENDENCY_GRAPH_ENABLED is set, and it is skipped on the queue and on master.
          case "$DEPENDENCY_REVIEW" in
            success) ;;
            skipped) [ "$DEPENDENCY_GRAPH_ENABLED" != true ] || [ "$GITHUB_EVENT_NAME" != pull_request ] || { echo "dependency_review: skipped"; failed=1; } ;;
            *) echo "dependency_review: $DEPENDENCY_REVIEW"; failed=1 ;;
          esac
          if [ "$failed" -ne 0 ]; then
            echo "pr-ok: a blocking lane did not succeed"
            exit 1
          fi
          echo "pr-ok: every blocking lane succeeded"
