name: pr-fast

# Guideline docs/testing/guideline.md 2.1-2.4. One job per changed partition, plus the
# security checks from 1.8 and 3. `pr-ok` is the single required check.
on:
  pull_request:
    branches: [master, phase-1-5]

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists PR files through the API
    outputs:
      partitions: ${{ steps.filter.outputs.changes }}
      dependencies: ${{ steps.deps.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One filter per row of the 2.2 partition map. Build paths are the 2.2 exception:
      # a build change can affect any package, so it runs every unit partition.
      # core-parse, app and registry-pack are partitions run-partition.sh supports beyond
      # 2.2; those packages already hold tests, so leaving them out would run nothing.
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            core-wallet:
              - 'shared/src/main/java/app/lensly/core/wallet/**'
              - 'shared/src/test/java/app/lensly/core/wallet/**'
              - 'shared/src/test/resources/vectors/bip39/**'
              - 'shared/src/test/resources/vectors/bip32/**'
              - 'shared/src/testFixtures/**'
              - 'build.gradle.kts'
              - 'app/build.gradle.kts'
              - 'shared/build.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'settings.gradle.kts'
            core-ur-evm:
              - 'shared/src/main/java/app/lensly/core/ur/**'
              - 'shared/src/main/java/app/lensly/core/evm/**'
              - 'shared/src/test/java/app/lensly/core/ur/**'
              - 'shared/src/test/java/app/lensly/core/evm/**'
              - 'shared/src/test/java/app/lensly/fuzz/**'
              - 'shared/src/test/resources/fuzz-seeds/**'
              - 'shared/src/test/resources/keystone/**'
              - 'shared/src/test/resources/vectors/eip155/**'
              - 'shared/src/test/resources/vectors/eip1559/**'
              - 'shared/src/test/resources/vectors/eip712/**'
              - 'shared/src/testFixtures/**'
              - 'build.gradle.kts'
              - 'app/build.gradle.kts'
              - 'shared/build.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'settings.gradle.kts'
            core-parse:
              - 'shared/src/main/java/app/lensly/core/parse/**'
              - 'shared/src/main/aidl/app/lensly/core/parse/**'
              - 'shared/src/test/java/app/lensly/core/parse/**'
              - 'shared/src/main/java/app/lensly/core/qr/**'
              - 'shared/src/main/aidl/app/lensly/core/qr/**'
              - 'shared/src/test/java/app/lensly/core/qr/**'
              - 'shared/src/testFixtures/**'
              - 'build.gradle.kts'
              - 'app/build.gradle.kts'
              - 'shared/build.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'settings.gradle.kts'
            core-vault:
              - 'shared/src/main/java/app/lensly/core/vault/**'
              - 'shared/src/test/java/app/lensly/core/vault/**'
              - 'shared/src/testFixtures/**'
              - 'build.gradle.kts'
              - 'app/build.gradle.kts'
              - 'shared/build.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'settings.gradle.kts'
            core-registry:
              - 'shared/src/main/java/app/lensly/core/registry/**'
              - 'shared/src/test/java/app/lensly/core/registry/**'
              - 'shared/src/main/assets/registry/**'
              - 'shared/src/debug/assets/registry/**'
              - 'shared/src/testFixtures/**'
              - 'build.gradle.kts'
              - 'app/build.gradle.kts'
              - 'shared/build.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'settings.gradle.kts'
            core-btc:
              - 'shared/src/main/java/app/lensly/core/btc/**'
              - 'shared/src/test/java/app/lensly/core/btc/**'
              - 'shared/src/test/resources/vectors/bitcoin/**'
              - 'shared/src/testFixtures/**'
              - 'build.gradle.kts'
              - 'app/build.gradle.kts'
              - 'shared/build.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'settings.gradle.kts'
            # The ui tests run as two partitions (ui-a, ui-b) with the same paths, so each change runs both.
            ui-a:
              - 'app/src/main/java/app/lensly/ui/**'
              - 'app/src/test/java/app/lensly/ui/**'
              - 'shared/src/main/java/app/lensly/ui/**'
              - 'shared/src/test/java/app/lensly/ui/**'
              - 'shared/src/testFixtures/**'
              - 'app/src/main/res/values/strings.xml'
              - 'build.gradle.kts'
              - 'app/build.gradle.kts'
              - 'shared/build.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'settings.gradle.kts'
            ui-b:
              - 'app/src/main/java/app/lensly/ui/**'
              - 'app/src/test/java/app/lensly/ui/**'
              - 'shared/src/main/java/app/lensly/ui/**'
              - 'shared/src/test/java/app/lensly/ui/**'
              - 'shared/src/testFixtures/**'
              - 'app/src/main/res/values/strings.xml'
              - 'build.gradle.kts'
              - 'app/build.gradle.kts'
              - 'shared/build.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'settings.gradle.kts'
            manifest:
              - 'app/src/**/AndroidManifest.xml'
              - 'shared/src/**/AndroidManifest.xml'
              - 'gradle/libs.versions.toml'
              - 'app/build.gradle.kts'
              - 'shared/build.gradle.kts'
            app:
              - 'app/src/main/java/app/lensly/app/**'
              - 'app/src/test/java/app/lensly/app/**'
              - 'app/src/test/java/app/lensly/SmokeTest.kt'
              - 'app/src/test/java/app/lensly/core/vault/BackupExclusionTest.kt'
              - 'build.gradle.kts'
              - 'app/build.gradle.kts'
              - 'shared/build.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'settings.gradle.kts'
            registry-pack:
              - 'tools/registry-pack/**'
              - 'shared/src/debug/assets/registry/**'
              - 'build.gradle.kts'
              - 'app/build.gradle.kts'
              - 'shared/build.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'settings.gradle.kts'
            # CI's own files cannot run Gradle: the partition syntax-checks every script and runs
            # the test-network guard. Without this row a workflow/script edit ran no test at all.
            ci:
              - 'scripts/ci/**'
              - '.github/workflows/**'
              - '.gitleaks.toml'

      # Guideline 1.8: dependency review runs on PRs touching dependency files. Kept in its
      # own step so the filter name never reaches the partition matrix. The graph it diffs
      # against is submitted by dependency-graph.yml on pushes to the long-lived branches.
      - id: deps
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            dependencies:
              - 'build.gradle.kts'
              - 'app/build.gradle.kts'
              - 'shared/build.gradle.kts'
              - 'tools/*/build.gradle.kts'
              - 'gradle/libs.versions.toml'
              - 'gradle/wrapper/**'
              - 'gradle.properties'
              - 'settings.gradle.kts'

  test:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.partitions != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # guideline 2.1 amendment (2026-11-12)
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(needs.changes.outputs.partitions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      # The cache this restores is warmed on master and phase-1-5 by cache-warm.yml. That workflow's
      # job is also named `test`: setup-gradle matches entries by job id, so the names must stay equal.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # run-partition.sh maps the name to its 2.2 selector; `manifest` runs check-manifest.sh and
      # `ci` runs only shell checks.
      - name: Run ${{ matrix.partition }}
        run: ./scripts/ci/run-partition.sh "${{ matrix.partition }}"

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks CLI v8.30.0 instead of gitleaks-action: the action v3 requires a license key for
      # organization repositories (GITLEAKS_LICENSE), and this repository has none. The tarball is
      # checked against the SHA-256 published with the release before it runs.
      # The range is the PR's commit range, so only changed content is checked.
      # .gitleaks.toml keeps the default rules and allowlists shared/src/test/resources/vectors.
      - name: Scan PR commits for secrets
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" --exit-code 1 .

  dependency_review:
    # Snapshot comes from dependency-graph.yml, which submits on pushes to master and phase-1-5.
    #
    # The repository's Dependency graph is off, and only an admin can turn it on
    # (Settings -> Code security). While it is off the action cannot diff anything and fails with
    # "Dependency review is not supported on this repository" on every dependency PR. To enable:
    # turn on Dependency graph, then set the repository variable DEPENDENCY_GRAPH_ENABLED=true.
    # Until both are done the job skips, which raises no annotation and counts as a pass in pr-ok.
    #
    # No continue-on-error on purpose. The `if` is the whole fix: a skipped job never runs the
    # action, so the unsupported-repository error cannot appear. continue-on-error would instead
    # report a genuine high-severity finding as success once the graph is on, which disarms 1.8.
    needs: changes
    if: needs.changes.outputs.dependencies == 'true' && vars.DEPENDENCY_GRAPH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  test_network:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Guideline 3: test code must not reference java.net., HttpURLConnection, or URL(.
      - run: ./scripts/ci/check-test-network.sh

  pr-ok: # the single required check
    if: always()
    needs: [changes, test, secrets, dependency_review, test_network]
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate results
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          SECRETS: ${{ needs.secrets.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
          TEST_NETWORK: ${{ needs.test_network.result }}
        run: |
          printf 'changes=%s test=%s secrets=%s dependency_review=%s test_network=%s\n' \
            "$CHANGES" "$TEST" "$SECRETS" "$DEPENDENCY_REVIEW" "$TEST_NETWORK"
          # test is skipped when no partition changed, and dependency review is skipped when
          # no dependency file changed or DEPENDENCY_GRAPH_ENABLED is not 'true'; both count as
          # a pass. Once the variable is set, a failing dependency review fails this check.
          case "$TEST" in
            success | skipped) ;;
            *) echo "test partition failed or was cancelled"; exit 1 ;;
          esac
          case "$DEPENDENCY_REVIEW" in
            success | skipped) ;;
            *) echo "dependency review failed"; exit 1 ;;
          esac
          for result in "$CHANGES" "$SECRETS" "$TEST_NETWORK"; do
            [ "$result" = success ] || { echo "a required job did not succeed"; exit 1; }
          done
