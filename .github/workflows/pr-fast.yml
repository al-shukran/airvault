name: pr-fast

# One gate for pull requests, the merge queue and master. Every event runs the same lanes (scripts/ci/README.md), so a change
# verified on its pull request is the change master builds after it lands. `pr-ok` is the single required check.
#
# Gradle runs offline in every job except `deps`. `deps` fills the Gradle module cache once per dependency key, with
# `./gradlew resolveAll`, and the other jobs restore that exact key. A missing artifact then fails by name, not by a network
# fetch, so a red run is never a dependency flake.
on:
  pull_request:
    branches: [master, phase-1-5]
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]

permissions:
  contents: read

# Build state. Each Gradle lane restores the newest master entry of its own state (.github/actions/gradle-lane): the project's
# build directories and Gradle's execution history (.gradle), which also holds the configuration cache. Gradle then reruns only
# the tasks whose inputs the change touched, and Kotlin compiles those incrementally. A restored build cache gave outputs but no
# incremental state, so any change in a low module (chains, core, shared) recompiled every module above it from scratch, in
# every lane, for 2 to 3 minutes. A pull request restores master's state and saves none, so each run of a pull request starts
# from master's last verified state. A push to master saves every lane's state, even when it fails or is
# cancelled; a queue entry saves none. `cache-prune` keeps the newest entry of each cache (scripts/ci/prune-caches.sh).
env:
  BUILD_CACHE_SCOPE: master # TEMP #567 experiment: this run saves state as if master
  # Gradle encrypts configuration-cache entries with this key. Without a shared key, each runner's own keystore encrypts them, so
  # no lane can read an entry another lane saved. The repository secret must exist for this to take effect (see the PR body).
  GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
  # The Gradle user-home directories the deps cache holds. The configuration cache names the generated ones (version-catalog
  # accessors, transformed and instrumented jars, compiled build scripts) as inputs, so a restore must bring them back too.
  # The directory names carry the Gradle version that gradle-wrapper.properties pins (9.7.0).
  DEPS_CACHE_PATHS: |
    ~/.gradle/caches/modules-2
    ~/.gradle/wrapper/dists
    ~/.gradle/caches/9.7.0/dependencies-accessors
    ~/.gradle/caches/9.7.0/generated-gradle-jars
    ~/.gradle/caches/9.7.0/kotlin-dsl
    ~/.gradle/caches/9.7.0/scripts
    ~/.gradle/caches/9.7.0/transforms
    ~/.gradle/caches/jars-9
  # The project-side state of a lane: every module's build directory and the project's .gradle directory.
  BUILD_STATE_PATHS: |
    .gradle
    **/build

# A pull request supersedes its own earlier run. A master push or a queue entry always finishes: each commit that lands is
# verified.
concurrency:
  group: pr-fast-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one job that may use the network for dependencies. The key covers the files that decide what Gradle resolves, so a
  # dependency change always makes a new key. On a hit this job only looks the key up: every lane restores the entry itself, so
  # a hit downloads nothing here, and no lane waits on a second 1.2 GB restore. On a miss it resolves online and saves the entry.
  # A miss can take three attempts of resolveAll (scripts/ci/run-partition.sh online), so this job has 10 minutes where the other
  # lanes have 5.
  deps:
    name: resolve dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The paths are DEPS_CACHE_PATHS (top of this file). Every job saves and restores that one list.
      - name: Look up the Gradle dependency cache
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_CACHE_PATHS }}
          key: deps-v3-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}
          lookup-only: true

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      # cache-disabled: setup-gradle's own cache entries were the poisoned ones (its cleanup purged plugin marker POMs). The
      # dependency and build caches below replace them.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          cache-disabled: true

      - name: Resolve every configuration (online, on a cache miss only)
        if: steps.deps.outputs.cache-hit != 'true'
        run: ./scripts/ci/run-partition.sh resolve

      - name: Save the Gradle dependency cache (on a cache miss only)
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_CACHE_PATHS }}
          key: deps-v3-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}

  # The unit tests of :app, :lumio, :shared and the pure JVM modules, in six balanced lanes (scripts/ci/shards.txt).
  shard:
    name: shard ${{ matrix.shard }}
    needs: deps
    runs-on: ubuntu-24.04
    # A lane whose build state is missing builds cold, which takes up to about 6 minutes. The lane budget (pr-ok) reports it.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/gradle-lane
        with:
          lanes: shard-${{ matrix.shard }}
          state: shard-${{ matrix.shard }}

      - name: Save the build state
        if: always()
        uses: ./.github/actions/gradle-lane/save
        with:
          state: shard-${{ matrix.shard }}

      - name: Upload the JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-shard-${{ matrix.shard }}
          path: '**/build/test-results/**/*.xml'
          retention-days: 3
          if-no-files-found: ignore

  # Roborazzi pixel tests of :app and :lumio, verified against the committed PNGs (guideline 2.7).
  roborazzi:
    name: verify screenshots
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/gradle-lane
        with:
          lanes: verify
          state: verify

      - name: Save the build state
        if: always()
        uses: ./.github/actions/gradle-lane/save
        with:
          state: verify

      - name: Upload the JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-verify
          path: '**/build/test-results/**/*.xml'
          retention-days: 3
          if-no-files-found: ignore

  # The Jazzer seed replays (app.lensly.fuzz.*). They run in their own JVM, so they are not in a shard.
  fuzz:
    name: fuzz replay
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/gradle-lane
        with:
          lanes: fuzz
          state: fuzz

      - name: Save the build state
        if: always()
        uses: ./.github/actions/gradle-lane/save
        with:
          state: fuzz

  # Assembles the Lumio debug APK. The androidTest and benchmark sources compile on master and in the merge queue only: no test lane
  # runs them, and they would add about two minutes to a pull request.
  android:
    name: lumio apk
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/gradle-lane
        with:
          lanes: ${{ github.event_name == 'pull_request' && 'apk' || 'apk android-tests' }}
          state: android

      - name: Save the build state
        if: always()
        uses: ./.github/actions/gradle-lane/save
        with:
          state: android

  # Android lint, one leg per module (scripts/ci/run-partition.sh lint-<module>). A leg compiles its module and the modules it
  # depends on, then lints its main sources, and the legs run on their own runners side by side, so no leg waits for another
  # module's compile or analysis. The unit-test and androidTest analyses run nightly (run_lint). pr-ok reads this job's result,
  # which is success only when every leg succeeds.
  lint:
    name: lint ${{ matrix.module }}
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [app, lumio, shared]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/gradle-lane
        with:
          lanes: lint-${{ matrix.module }}
          state: lint-${{ matrix.module }}

      - name: Save the build state
        if: always()
        uses: ./.github/actions/gradle-lane/save
        with:
          state: lint-${{ matrix.module }}

  # Guideline 1.8 and R56. The merged manifests and the OkHttp check (scripts/ci/run-partition.sh manifest).
  manifest:
    name: manifest guards
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/gradle-lane
        with:
          lanes: manifest

  # No Gradle: every script's syntax, the test-class coverage of the lanes, and the test-network guard (guideline 3).
  ci:
    name: ci scripts and test coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check CI scripts, test coverage and the network guard
        run: ./scripts/ci/run-partition.sh ci

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks CLI v8.30.0 instead of gitleaks-action: the action v3 requires a license key for organization repositories
      # (GITLEAKS_LICENSE), and this repository has none. The tarball is checked against the SHA-256 published with the release.
      # The range is the commit range of the event (the pull request, the queue entry or the push), so only changed content is checked.
      # .gitleaks.toml keeps the default rules and allowlists shared/src/test/resources/vectors.
      - name: Scan the commits of the event for secrets
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" --exit-code 1 .

  dependency_review:
    # Snapshot comes from dependency-graph.yml, which submits on pushes to master and phase-1-5.
    #
    # The repository's Dependency graph is off, and only an admin can turn it on (Settings -> Code security). While it is off
    # the action cannot diff anything and fails with "Dependency review is not supported on this repository". To enable: turn on
    # Dependency graph, then set the repository variable DEPENDENCY_GRAPH_ENABLED=true. Until both are done the job skips, which
    # counts as a pass in pr-ok. The action reads pull requests only, so the merge queue and master skip it too.
    #
    # No continue-on-error on purpose: a genuine high-severity finding must fail the check once the graph is on.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_GRAPH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Deletes superseded master caches after every lane of this push has saved, so the previous master's state stays restorable
  # until then. Each cache keeps its newest entry and no entry newer than this run is deleted, so a late or rerun prune of an
  # older push never deletes a newer push's state. The group runs one prune at a time.
  cache-prune:
    name: prune superseded caches
    if: always() && github.event_name == 'push'
    needs: [deps, shard, roborazzi, fuzz, android, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: master-cache-prune
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      # Master's current head, not this run's commit: a late or rerun prune must keep the newest tree's entries.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MASTER_DEPS_KEY: deps-v3-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}
        run: MASTER_SHA="$(git rev-parse HEAD)" scripts/ci/prune-caches.sh

  pr-ok: # the single required check
    if: always()
    needs: [deps, shard, roborazzi, fuzz, android, lint, manifest, ci, secrets, dependency_review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # the lane times of this run
      contents: read
      issues: write # the ci-budget issue, on a push to master
    env:
      DEPS: ${{ needs.deps.result }}
      SHARD: ${{ needs.shard.result }}
      ROBORAZZI: ${{ needs.roborazzi.result }}
      FUZZ: ${{ needs.fuzz.result }}
      ANDROID: ${{ needs.android.result }}
      LINT: ${{ needs.lint.result }}
      MANIFEST: ${{ needs.manifest.result }}
      CI: ${{ needs.ci.result }}
      SECRETS: ${{ needs.secrets.result }}
      DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
      DEPENDENCY_GRAPH_ENABLED: ${{ vars.DEPENDENCY_GRAPH_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      # The machine-enforced budget (scripts/ci/lane-budget.sh). It reports and files an issue; it never fails the gate, so a
      # slow lane is fixed in a pull request, not rerun to green.
      - name: Check the lane budget
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FILE_ISSUE: ${{ github.event_name == 'push' }}
        run: scripts/ci/lane-budget.sh

      - name: Aggregate results
        run: |
          failed=0
          for pair in "deps=$DEPS" "shard=$SHARD" "roborazzi=$ROBORAZZI" "fuzz=$FUZZ" "android=$ANDROID" \
                      "lint=$LINT" "manifest=$MANIFEST" "ci=$CI" "secrets=$SECRETS"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" != success ]; then
              echo "$name: $result"
              failed=1
            fi
          done
          # Dependency review is skipped until DEPENDENCY_GRAPH_ENABLED is set, and it is skipped on the queue and on master.
          case "$DEPENDENCY_REVIEW" in
            success) ;;
            skipped) [ "$DEPENDENCY_GRAPH_ENABLED" != true ] || [ "$GITHUB_EVENT_NAME" != pull_request ] || { echo "dependency_review: skipped"; failed=1; } ;;
            *) echo "dependency_review: $DEPENDENCY_REVIEW"; failed=1 ;;
          esac
          if [ "$failed" -ne 0 ]; then
            echo "pr-ok: a required lane did not succeed"
            exit 1
          fi
          echo "pr-ok: every lane succeeded"
