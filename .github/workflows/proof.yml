name: proof
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
env:
  DEPS_CACHE_PATHS: |
    ~/.gradle/caches/modules-2
    ~/.gradle/wrapper/dists
    ~/.gradle/caches/9.7.0/dependencies-accessors
    ~/.gradle/caches/9.7.0/generated-gradle-jars
    ~/.gradle/caches/9.7.0/kotlin-dsl
    ~/.gradle/caches/9.7.0/scripts
    ~/.gradle/caches/9.7.0/transforms
    ~/.gradle/caches/jars-9
jobs:
  proof:
    name: proof ${{ matrix.job }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Restore the Gradle dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_CACHE_PATHS }}
          key: deps-v3-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}
          fail-on-cache-miss: true
      - name: Restore the Gradle build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            .gradle/configuration-cache
          key: bc-shard-6-master
          restore-keys: |
            bc-shard-
      - name: Run the test 10 times under CPU load
        env:
          PROOF_REPEAT: '25'
        run: |
          unset GRADLE_ENCRYPTION_KEY
          mkdir -p /tmp/proof-xml
          for i in $(seq $((2 * $(nproc)))); do ( while :; do :; done ) & done
          LOAD="$(jobs -p)"
          for run in $(seq 10); do
            ./gradlew --offline --max-workers=3 :lumio:testDebugUnitTest --tests app.lumio.data.electrum.ElectrumPoolTest --rerun || true
            cp lumio/build/test-results/testDebugUnitTest/*ElectrumPoolTest.xml /tmp/proof-xml/run-$run.xml || true
          done
          kill $LOAD || true
          echo "== runs with a failure of the target test"
          grep -l "<failure" /tmp/proof-xml/*.xml | wc -l
          echo "== PROOF lines"
          grep -h "PROOF-" /tmp/proof-xml/*.xml | head -200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: proof-xml-${{ matrix.job }}
          path: /tmp/proof-xml
