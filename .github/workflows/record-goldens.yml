name: record-goldens

# Re-records the Roborazzi goldens on the Linux runner, the image they must come from. A macOS render differs from it on
# anti-aliased edges. The nightly `screenshots` job records them on each push to master and proposes changes in the
# goldens-refresh pull request, so this manual run is for an immediate artifact. Run it with `gh workflow run record-goldens`,
# download the `goldens-linux` artifact, review the PNG diff, and commit it (docs/testing/guideline.md 1.5).

on:
  workflow_dispatch:

# Least privilege at the top. The job only reads the repository and uploads an artifact.
permissions:
  contents: read

# A new run on the same ref supersedes the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      # cache-disabled, as in pr-fast.yml: setup-gradle would save its own entries. This job only restores the dependency cache below.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # The same paths and key as pr-fast.yml's deps cache (DEPS_CACHE_PATHS), restored read-only. The Robolectric android-all jar
      # resolves into modules-2 like any other module, so a hit keeps this job off Maven Central. A miss runs online, as before.
      - name: Restore the Gradle dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/*/dependencies-accessors
            ~/.gradle/caches/*/generated-gradle-jars
            ~/.gradle/caches/*/kotlin-dsl
            ~/.gradle/caches/*/scripts
            ~/.gradle/caches/*/transforms
            ~/.gradle/caches/jars-*
          key: deps-v3-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}

      - name: Record goldens
        run: ./gradlew :app:recordRoborazziDebug :lumio:recordRoborazziDebug --continue

      - name: Upload goldens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens-linux
          path: |
            app/src/test/screenshots
            lumio/src/test/screenshots
          if-no-files-found: error
