name: master-red

# Opens or comments on the one open `ci-red` issue when the blocking set (pr-fast) fails on master, and closes it once pr-fast's
# latest run on master is green. Nightly checks never reach this file: each one opens its own issue (nightly.yml). It reads run
# data and writes issues; it gates nothing. As with every workflow_run workflow, GitHub runs only the copy of this file on the
# default branch.
on:
  workflow_run:
    # Every master push runs pr-fast, and its master runs decide whether master is red.
    workflows: [pr-fast]
    types: [completed]

permissions:
  contents: read

# One alarm at a time, so two failures that finish together cannot open two issues. Runs for other branches skip in the job below,
# so each gets its own group and cannot replace a queued master alarm.
concurrency:
  group: master-red-${{ github.event.workflow_run.head_branch == 'master' && 'master' || github.run_id }}
  cancel-in-progress: false

jobs:
  alarm:
    # Only master counts. A cancelled run is a superseded push, not a failure.
    if: github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # the failed job names, and the latest master runs of pr-fast
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WORKFLOW: ${{ github.event.workflow_run.name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Open, comment on, or close the ci-red issue
        run: |
          set -euo pipefail
          label=ci-red
          gh label create "$label" --repo "$REPO" --color B60205 --description "master is red (master-red.yml)" --force

          open_issue() {
            gh issue list --repo "$REPO" --label "$label" --state open --json number --jq '.[0].number // empty'
          }

          case "$CONCLUSION" in
            failure)
              failed=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs \
                --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
              [ -n "$failed" ] || failed="none listed; see the run"
              body=$(printf '%s failed on master.\n\n- Run: %s\n- Commit: %s\n- Failed jobs: %s\n' \
                "$WORKFLOW" "$RUN_URL" "$SHA" "$failed")
              n=$(open_issue)
              if [ -n "$n" ]; then
                gh issue comment "$n" --repo "$REPO" --body "$body"
              else
                gh issue create --repo "$REPO" --label "$label" --title "master is red" --body "$body"
              fi
              ;;
            success)
              n=$(open_issue)
              [ -n "$n" ] || exit 0
              # The latest finished, non-cancelled run on master decides whether pr-fast is red, so a newer failed push keeps the issue open.
              latest=$(gh run list --repo "$REPO" --workflow pr-fast.yml --branch master --limit 10 --json conclusion,status \
                --jq '[.[] | select(.status == "completed" and .conclusion != "cancelled" and .conclusion != "skipped")][0].conclusion // empty')
              if [ "$latest" = failure ]; then
                gh issue comment "$n" --repo "$REPO" --body "$WORKFLOW is green on master ($RUN_URL), but its latest master run failed. Still red."
              else
                gh issue comment "$n" --repo "$REPO" --body "pr-fast is green on master again ($RUN_URL). Closing."
                gh issue close "$n" --repo "$REPO" --reason completed
              fi
              ;;
            *) echo "conclusion '$CONCLUSION': nothing to record" ;;
          esac
