name: nightly

# The unit tests, lint, screenshot verification and seed replays run in pr-fast.yml on every pull request, the merge queue and
# master. Nightly keeps only what is not a gate: the R8 release build, OWASP, real fuzzing, and the emulator and benchmark runs.

on:
  schedule:
    - cron: '17 3 * * *'       # 03:17 UTC daily
  workflow_dispatch:

# Least privilege at the top. Only `report` can write, and only to issues.
permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The app compiles to Java 17 (compileOptions in app/build.gradle.kts); the JDK here is 21, as in pr-fast.yml.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The release build of :app is minified by R8 (app/build.gradle.kts, app/proguard-rules.pro). It runs here and not in the
      # PR lane: a cold R8 build does not fit the 5-minute lane cap (guideline 2.1). mapping.txt is written only when minify
      # runs, so a build that skipped R8 fails this step. `if` keeps it running after an earlier failure, as the OWASP steps do.
      - name: Release build of :app (R8)
        if: ${{ !cancelled() }}
        run: |
          ./gradlew :app:assembleRelease
          test -s app/build/outputs/mapping/release/mapping.txt

      # OWASP dependency-check (guideline 1.8) runs in three steps after the gates, so one run still reports every
      # broken gate. It needs the NVD database. The database is cached per ISO week in the plugin's data directory,
      # ~/.gradle/dependency-check-data (the default of dependency-check-gradle 13.0.0, see app/build.gradle.kts). A new
      # week misses the exact key and restores the newest cache through restore-keys; the update step then fetches
      # only what changed since that cache was saved.
      - name: OWASP cache key
        id: owasp-key
        if: ${{ !cancelled() }}
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore OWASP NVD data
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ steps.owasp-key.outputs.week }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      # Step 1, the NVD refresh. An NVD outage is retried three times, a minute apart, and the step is capped at five minutes.
      # It used to wait up to 70 minutes (run 43859789186), so one NVD outage held the nightly red for hours. continue-on-error
      # keeps the job going when NVD stays down; step 2 decides what that means.
      # The update runs with --no-configuration-cache: gradle.properties enables the configuration cache, and the
      # plugin's Update task cannot be stored in it (dependency-check-gradle 13.0.0 serializes DefaultProject, which
      # Gradle rejects), so the task fails at configuration time. Analyze is unaffected.
      #
      # NVD_API_KEY lifts the NVD API rate limit. Set it as a repository secret; without it the update still runs,
      # just slower (one NVD call every 8 seconds), so a missing secret never fails the build.
      - name: OWASP NVD update
        id: owasp-update
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-configuration-cache :app:dependencyCheckUpdate 2>&1 | tee dependency-check-update.log; then
              exit 0
            fi
            grep -q -E "NVD Returned Status Code|Error updating the NVD Data" dependency-check-update.log || exit 1
            echo "NVD is unavailable (attempt $attempt of 3); retrying in 60 seconds"
            sleep 60
          done
          exit 1

      # Step 2, the analysis. It always runs with autoUpdate off (-PowaspAutoUpdate=false, app/build.gradle.kts), so it
      # makes no NVD call and reads the local database. When step 1 did not succeed, it evaluates CVEs against the
      # restored cache, and the CVSS 7.0 gate still applies. With no cached database there is nothing to evaluate
      # against, so the step fails with a clear message. failOnError keeps its default (true): an analysis error
      # still fails the job.
      - name: OWASP dependency check
        if: ${{ !cancelled() }}
        env:
          UPDATE_OUTCOME: ${{ steps.owasp-update.outcome }}
        run: |
          set -euo pipefail
          if [ "$UPDATE_OUTCOME" != "success" ]; then
            if [ -z "$(find "$HOME/.gradle/dependency-check-data" -name odc.mv.db -size +0 -print -quit 2>/dev/null)" ]; then
              echo "::error::OWASP: the NVD update did not succeed ($UPDATE_OUTCOME) and no cached OWASP database was restored, so there are no CVEs to evaluate. Rerun the nightly once NVD is reachable."
              exit 1
            fi
            echo "::warning::OWASP: the NVD update did not succeed ($UPDATE_OUTCOME); evaluating CVEs against the cached database."
          fi
          ./gradlew :app:dependencyCheckAnalyze -PowaspAutoUpdate=false

  fuzz:
    # Guideline 2.5: fuzzing is its own job. One matrix leg per Jazzer target, so a crash in one
    # target does not hide the other three. fuzz-nightly.sh keeps the 15 minutes per target from
    # the @FuzzTest annotation; the timeout below covers one target plus a cold build.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - app.lensly.fuzz.UrScannerFuzzTest
          - app.lensly.fuzz.CborFuzzTest
          - app.lensly.fuzz.EthSignRequestFuzzTest
          - app.lensly.fuzz.UnsignedTxFuzzTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Fuzz ${{ matrix.target }}
        run: ./scripts/ci/fuzz-nightly.sh "${{ matrix.target }}"

  instrumented:
    # Guideline 1.3 on an emulator, separate from the host-only gates in `full`.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Without /dev/kvm the runner falls back to `-accel off` (software x86 emulation), and an API 34 x86_64
      # image does not finish booting inside its 600 s timeout. The udev rule opens KVM to the runner user.
      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod 0666 /dev/kvm
          test -w /dev/kvm

      - name: Run connected debug tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # The benchmark classes need AndroidBenchmarkRunner, which only the benchmark variant
          # gets; the debug runner cannot run them, so skip that package (same as run-extended.sh).
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.notPackage=app.lensly.benchmark

      - name: Upload connected test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-test-results
          path: |
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    # Guideline 1.6: the wallet sign flow on an emulator, separate from `instrumented` so one
    # error report names the layer.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod 0666 /dev/kvm
          test -w /dev/kvm

      - name: Run WalletSignFlowTest on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=app.lensly.e2e.WalletSignFlowTest

      - name: Upload e2e test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: |
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
          retention-days: 7
          if-no-files-found: ignore

  benchmark:
    # Guideline 1.7: emulator numbers are trend data only. The 10% gate needs the reference
    # device and runs there through /run-perf; nothing here claims a gate verdict.
    # :benchmark (macrobenchmark) stays deferred; see its README.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod 0666 /dev/kvm
          test -w /dev/kvm

      - name: Run microbenchmarks on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Trend data, not the reference-device gate; androidx.benchmark aborts on an emulator without EMULATOR.
          # NOT-AOT-COMPILED: the CI emulator runs the app without a profile-guided AOT compile, so the runner refuses
          # to time it. Suppressed for the same reason as EMULATOR: these numbers are trend data, never a gate.
          # The package filter keeps a11y/e2e/vault out of the run. The `class` argument takes exact class names; the
          # earlier `.*` glob named no class, so no benchmark ever ran.
          script: >-
            ./gradlew :app:connectedBenchmarkAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.package=app.lensly.benchmark
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,NOT-AOT-COMPILED

      - name: Upload benchmark test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-test-results
          path: |
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Confirm trend-only
        run: echo "Emulator results are trend data; the 10% gate runs on the reference device only."

  report:
    # Guideline 2.5: exactly one issue or comment per run. The per-job steps it replaces could
    # race and open one issue per failing job; this job reads the needs results instead.
    needs: [full, fuzz, instrumented, e2e, benchmark]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FULL: ${{ needs.full.result }}
          FUZZ: ${{ needs.fuzz.result }}
          INSTRUMENTED: ${{ needs.instrumented.result }}
          E2E: ${{ needs.e2e.result }}
          BENCHMARK: ${{ needs.benchmark.result }}
        run: |
          set -euo pipefail
          failed=""
          for entry in "full=$FULL" "fuzz=$FUZZ" "instrumented=$INSTRUMENTED" \
                       "e2e=$E2E" "benchmark=$BENCHMARK"; do
            case "${entry#*=}" in
              failure | cancelled) failed="$failed ${entry%%=*}" ;;
            esac
          done
          failed="${failed# }"
          [ -n "$failed" ] || failed="unknown"
          body="Run: $RUN_URL
          Failed jobs: $failed"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" -l nightly-failure -s open \
                --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              -t "Nightly failed $(date -u +%F)" -l nightly-failure \
              -b "$body"
          fi
