name: nightly

on:
  schedule:
    - cron: '17 3 * * *'       # 03:17 UTC daily
  workflow_dispatch:

# Least privilege at the top. Only `report` can write, and only to issues.
permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app compiles to Java 17 (compileOptions in app/build.gradle.kts); the tests run on 21 here,
      # same as the PR lane in ci.yml.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # One gradle invocation, as guideline 2.5 lists. --continue keeps going after the first
      # failure so one run reports every broken gate.
      #
      # NVD_API_KEY lifts the NVD API rate limit. Set it as a repository secret; without it the
      # dependency-check step still runs, just slower (one NVD call every 8 seconds), so a missing
      # secret never fails the build.
      - name: Nightly gates
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew test lintDebug verifyRoborazziDebug dependencyCheckAnalyze --continue

      # TEMPORARY DIAGNOSTIC (remove before merge): keep the Roborazzi diffs of a failed run.
      - name: Upload Roborazzi diffs (diagnostic)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roborazzi-diffs
          path: |
            app/build/outputs/roborazzi
            app/build/reports/roborazzi
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

      # The fuzz targets replay their committed seeds in a second invocation, with -PfuzzLane. They must not
      # share a JVM with the Robolectric tests above: Jazzer and Robolectric cannot (see the note in
      # app/build.gradle.kts). The 15-minute real fuzzing stays in the `fuzz` job below.
      - name: Nightly fuzz replay
        run: ./gradlew :app:testDebugUnitTest --tests 'app.lensly.fuzz.*' -PfuzzLane

  fuzz:
    # Guideline 2.5: fuzzing is its own job. One matrix leg per Jazzer target, so a crash in one
    # target does not hide the other three. fuzz-nightly.sh keeps the 15 minutes per target from
    # the @FuzzTest annotation; the timeout below covers one target plus a cold build.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - app.lensly.fuzz.UrScannerFuzzTest
          - app.lensly.fuzz.CborFuzzTest
          - app.lensly.fuzz.EthSignRequestFuzzTest
          - app.lensly.fuzz.UnsignedTxFuzzTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Fuzz ${{ matrix.target }}
        run: ./scripts/ci/fuzz-nightly.sh "${{ matrix.target }}"

  instrumented:
    # Guideline 1.3 on an emulator, separate from the host-only gates in `full`.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Without /dev/kvm the runner falls back to `-accel off` (software x86 emulation), and an API 34 x86_64
      # image does not finish booting inside its 600 s timeout. The udev rule opens KVM to the runner user.
      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm

      - name: Run connected debug tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # The benchmark classes need AndroidBenchmarkRunner, which only the benchmark variant
          # gets; the debug runner cannot run them, so skip that package (same as run-extended.sh).
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.notPackage=app.lensly.benchmark

  e2e:
    # Guideline 1.6: the wallet sign flow on an emulator, separate from `instrumented` so one
    # error report names the layer.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm

      - name: Run WalletSignFlowTest on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=app.lensly.e2e.WalletSignFlowTest

  benchmark:
    # Guideline 1.7: emulator numbers are trend data only. The 10% gate needs the reference
    # device and runs there through /run-perf; nothing here claims a gate verdict.
    # :benchmark (macrobenchmark) stays deferred; see its README.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm

      - name: Run microbenchmarks on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Trend data, not the reference-device gate; androidx.benchmark aborts on an emulator without this.
          # The class filter keeps a11y/e2e/vault out of the run: they are not benchmark classes.
          script: >-
            ./gradlew :app:connectedBenchmarkAndroidTest
            "-Pandroid.testInstrumentationRunnerArguments.class=app.lensly.benchmark.*"
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR

      - name: Confirm trend-only
        run: echo "Emulator results are trend data; the 10% gate runs on the reference device only."

  report:
    # Guideline 2.5: exactly one issue or comment per run. The per-job steps it replaces could
    # race and open one issue per failing job; this job reads the needs results instead.
    needs: [full, fuzz, instrumented, e2e, benchmark]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FULL: ${{ needs.full.result }}
          FUZZ: ${{ needs.fuzz.result }}
          INSTRUMENTED: ${{ needs.instrumented.result }}
          E2E: ${{ needs.e2e.result }}
          BENCHMARK: ${{ needs.benchmark.result }}
        run: |
          set -euo pipefail
          failed=""
          for entry in "full=$FULL" "fuzz=$FUZZ" "instrumented=$INSTRUMENTED" \
                       "e2e=$E2E" "benchmark=$BENCHMARK"; do
            case "${entry#*=}" in
              failure | cancelled) failed="$failed ${entry%%=*}" ;;
            esac
          done
          failed="${failed# }"
          [ -n "$failed" ] || failed="unknown"
          body="Run: $RUN_URL
          Failed jobs: $failed"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" -l nightly-failure -s open \
                --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              -t "Nightly failed $(date -u +%F)" -l nightly-failure \
              -b "$body"
          fi
