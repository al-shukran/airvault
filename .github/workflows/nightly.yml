name: nightly

on:
  schedule:
    - cron: '17 3 * * *'       # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app compiles to Java 17 (compileOptions in app/build.gradle.kts); the tests run on 21 here,
      # same as the PR lane in ci.yml.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Guideline 2.5 lists dependencyCheckAnalyze, but the OWASP plugin is not in the version
      # catalog yet: an unknown task would fail the whole run before anything else executes.
      # Until it lands (follow-up), run every nightly task that exists today. --continue keeps
      # going after the first failure so one run reports every broken gate.
      - name: Nightly gates
        run: ./gradlew test lintDebug verifyRoborazziDebug --continue

      # Guideline 2.5: one open nightly-failure issue, updated while the run stays red, so
      # repeated failures comment on the same issue instead of opening a new one every night.
      - name: Open or update issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" -l nightly-failure -s open \
                --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" \
              --body "Still failing: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              -t "Nightly failed $(date -u +%F)" -l nightly-failure \
              -b "Run: $RUN_URL"
          fi
