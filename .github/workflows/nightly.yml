name: nightly

# Checks that never block a pull request. The gate is ci.yml, and pr-ok is its only required check. This workflow runs on the
# schedule and on every push to master. A failing check opens or refreshes one issue for that check (`report`). It never opens the
# ci-red alarm (master-red.yml watches ci.yml only).
#
# Fail-fast order: `build` runs first (dependencies, lint, the Lumio APK, the androidTest compile; on the schedule also the unit
# tests), and `screenshots`, `fuzz` and `emulator` need it, so a master that does not lint or compile stops there. On a master
# push only `build` and then `screenshots` run: one job at a time. `screenshots` re-records the Roborazzi goldens on the Linux
# runner (the image they must come from), and a changed golden goes to the goldens-refresh pull request for review rather than
# failing the run. `full` (the R8 build and OWASP), `fuzz` (real fuzzing) and `emulator` (instrumented tests and benchmarks)
# are schedule-only.
#
# Nightly saves no build cache: its setup-gradle steps run with cache-disabled or cache-read-only. `build` saves the dependency
# cache only on a miss, under the key ci.yml uses.

on:
  schedule:
    - cron: '17 3 * * *'       # 03:17 UTC daily
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege at the top. `screenshots` writes the goldens-refresh branch and its pull request, and `report` writes issues.
permissions:
  contents: read

# One run per event and ref. A newer push to master cancels the older run; scheduled and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# The dependency cache the jobs below restore. These are the paths and the key of ci.yml.
env:
  DEPS_CACHE_PATHS: |
    ~/.gradle/caches/modules-2
    ~/.gradle/wrapper/dists
    ~/.gradle/caches/*/dependencies-accessors
    ~/.gradle/caches/*/generated-gradle-jars
    ~/.gradle/caches/*/kotlin-dsl
    ~/.gradle/caches/*/scripts
    ~/.gradle/caches/*/transforms
    ~/.gradle/caches/jars-*

jobs:
  # Resolves the dependencies (online on a cache miss only, as ci.yml does), so the jobs after it restore a complete cache, then
  # runs the cheap checks in order: lint, the Lumio debug APK, the androidTest and benchmark compile, and on the schedule the unit
  # tests (ci.yml already ran them on the pull request and on the master push).
  build:
    name: lint and android build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Restore the Gradle dependency cache
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_CACHE_PATHS }}
          key: deps-v3-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}

      - name: Resolve every configuration (online, on a cache miss only)
        if: steps.deps.outputs.cache-hit != 'true'
        run: scripts/ci/run-step.sh resolve

      - name: Lint
        run: scripts/ci/run-step.sh lint

      - name: Assemble the Lumio debug APK
        run: scripts/ci/run-step.sh apk

      - name: Compile androidTest and benchmark
        run: scripts/ci/run-step.sh android-tests

      - name: Unit tests
        if: github.event_name != 'push'
        run: scripts/ci/run-step.sh unit

      - name: Upload the JUnit results
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit
          path: '**/build/test-results/**/*.xml'
          retention-days: 3
          if-no-files-found: ignore

  # The release build of :app is minified by R8 (app/build.gradle.kts, app/proguard-rules.pro), then the OWASP CVE scan. It runs
  # here and not in the pull request gate: a cold R8 build is slow, and OWASP depends on NVD being reachable. mapping.txt is written
  # only when minify runs, so a build that skipped R8 fails this step. It needs no `build`, and the OWASP steps run after a failed
  # R8 build (`if: !cancelled()`), so a broken build never hides a CVE.
  full:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The app compiles to Java 21 (compileOptions in app/build.gradle.kts); the JDK here is 21, as in ci.yml.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Release build of :app (R8)
        if: ${{ !cancelled() }}
        run: |
          ./gradlew :app:assembleRelease
          test -s app/build/outputs/mapping/release/mapping.txt
          scripts/ci/check-release-classpath.sh

      # OWASP dependency-check (guideline 1.8) runs in three steps after the gates, so one run still reports every
      # broken gate. It needs the NVD database. The database is cached per ISO week in the plugin's data directory,
      # ~/.gradle/dependency-check-data (the default of dependency-check-gradle 13.0.0, see app/build.gradle.kts). A new
      # week misses the exact key and restores the newest cache through restore-keys; the update step then fetches
      # only what changed since that cache was saved.
      - name: OWASP cache key
        id: owasp-key
        if: ${{ !cancelled() }}
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore OWASP NVD data
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ steps.owasp-key.outputs.week }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      # Step 1, the NVD refresh. An NVD outage is retried three times, a minute apart, and the step is capped at five minutes.
      # It used to wait up to 70 minutes (run 43859789186), so one NVD outage held the nightly red for hours. continue-on-error
      # keeps the job going when NVD stays down; step 2 decides what that means.
      # The update runs with --no-configuration-cache: gradle.properties enables the configuration cache, and the
      # plugin's Update task cannot be stored in it (dependency-check-gradle 13.0.0 serializes DefaultProject, which
      # Gradle rejects), so the task fails at configuration time. Analyze is unaffected.
      #
      # NVD_API_KEY lifts the NVD API rate limit. Set it as a repository secret; without it the update still runs,
      # just slower (one NVD call every 8 seconds), so a missing secret never fails the build.
      - name: OWASP NVD update
        id: owasp-update
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-configuration-cache :app:dependencyCheckUpdate 2>&1 | tee dependency-check-update.log; then
              exit 0
            fi
            grep -q -E "NVD Returned Status Code|Error updating the NVD Data" dependency-check-update.log || exit 1
            echo "NVD is unavailable (attempt $attempt of 3); retrying in 60 seconds"
            sleep 60
          done
          exit 1

      # Step 2, the analysis. It always runs with autoUpdate off (-PowaspAutoUpdate=false, app/build.gradle.kts), so it
      # makes no NVD call and reads the local database. When step 1 did not succeed, it evaluates CVEs against the
      # restored cache, and the CVSS 7.0 gate still applies. With no cached database there is nothing to evaluate
      # against, so the step fails with a clear message. failOnError keeps its default (true): an analysis error
      # still fails the job.
      - name: OWASP dependency check
        if: ${{ !cancelled() }}
        env:
          UPDATE_OUTCOME: ${{ steps.owasp-update.outcome }}
        run: |
          set -euo pipefail
          if [ "$UPDATE_OUTCOME" != "success" ]; then
            if [ -z "$(find "$HOME/.gradle/dependency-check-data" -name odc.mv.db -size +0 -print -quit 2>/dev/null)" ]; then
              echo "::error::OWASP: the NVD update did not succeed ($UPDATE_OUTCOME) and no cached OWASP database was restored, so there are no CVEs to evaluate. Rerun the nightly once NVD is reachable."
              exit 1
            fi
            echo "::warning::OWASP: the NVD update did not succeed ($UPDATE_OUTCOME); evaluating CVEs against the cached database."
          fi
          ./gradlew :app:dependencyCheckAnalyze -PowaspAutoUpdate=false

  # Records the Roborazzi goldens on the Linux runner (record-goldens.yml does the same by hand). A pixel change does not fail
  # the run: a changed golden goes to the goldens-refresh pull request, which a coordinator reviews and merges. A test that
  # cannot run fails the job, and `report` opens its issue. The refresh pull request gets no ci run, because a workflow
  # token creates it and GitHub does not start workflows from such events.
  screenshots:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    # Two runs must not force-push the same branch at once.
    concurrency:
      group: goldens-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Restore the Gradle dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_CACHE_PATHS }}
          key: deps-v3-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}
          fail-on-cache-miss: true

      - name: Record goldens
        run: ./gradlew --offline :app:recordRoborazziDebug :lumio:recordRoborazziDebug

      # Runs only after a clean recording. The branch always starts from this run's commit, so it never carries stale goldens.
      - name: Propose the changed goldens
        id: propose
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The GitHub API and git remote time out now and then (#1367). Each call that reaches them gets three tries.
          retry() {
            local n
            for n in 1 2 3; do
              "$@" && return 0
              echo "attempt $n of 3 failed: $1 $2" >&2
              sleep $((n * 15))
            done
            return 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C goldens-refresh
          git add app/src/test/screenshots lumio/src/test/screenshots
          pr=$(retry gh pr list --repo "$GH_REPO" --head goldens-refresh --state open --json number --jq '.[0].number // empty')
          if git diff --cached --quiet; then
            echo "The recorded goldens match the committed ones."
            if [ -n "$pr" ]; then
              # Closes without a comment, then comments once, so a retry never posts the comment twice (#1443).
              retry scripts/ci/close-refresh-pr.sh "$pr"
            fi
            echo "goldens_match=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit --signoff --message "Refresh screenshot goldens" --message "Recorded on the Linux runner by $RUN_URL."
          retry git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" HEAD:refs/heads/goldens-refresh
          if [ -z "$pr" ]; then
            retry gh pr create --repo "$GH_REPO" --base master --head goldens-refresh --title "Refresh Screenshot Goldens" \
              --label scope:common --label area:ci --label difficulty:easy \
              --body "Nightly recorded these goldens on the Linux runner ($RUN_URL). Review the PNG diff, and merge only the changes the screen was meant to make. Goldens come from this runner only (docs/testing/guideline.md 1.5)."
          fi

      # Runs only when the goldens match, after the refresh PR is closed. A branch that is already gone (404, or 422 "Reference does not exist") counts as deleted.
      - name: Delete the goldens-refresh branch
        if: steps.propose.outputs.goldens_match == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          delete_branch() {
            local out
            out=$(gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/goldens-refresh" 2>&1) && return 0
            case "$out" in
              *"HTTP 404"* | *"Reference does not exist"*) return 0 ;;
            esac
            echo "$out" >&2
            return 1
          }
          for n in 1 2 3; do
            delete_branch && exit 0
            echo "attempt $n of 3 failed: delete goldens-refresh" >&2
            sleep $((n * 15))
          done
          exit 1

  # Real fuzzing: fuzz-nightly.sh fuzzes the five Jazzer targets one after another, 15 minutes each (the @FuzzTest annotation).
  # It fuzzes every target even after one crashes, so one crash does not hide the other four.
  fuzz:
    if: github.event_name != 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Restore the Gradle dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_CACHE_PATHS }}
          key: deps-v3-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}
          fail-on-cache-miss: true

      - name: Fuzz every target
        run: scripts/ci/fuzz-nightly.sh

  # One emulator for guideline 1.3 (instrumented, which includes the 1.6 end-to-end sign flows in app.lensly.e2e) and 1.7
  # (microbenchmarks, trend data only). The script stops at the first failing line.
  emulator:
    if: github.event_name != 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # Without /dev/kvm the runner falls back to `-accel off` (software x86 emulation), and an API 34 x86_64
      # image does not finish booting inside its 600 s timeout. The udev rule opens KVM to the runner user.
      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod 0666 /dev/kvm
          test -w /dev/kvm

      # Instrumented: the benchmark classes need AndroidBenchmarkRunner, which only the benchmark variant gets; the debug runner
      # cannot run them, so that package is skipped (same as run-extended.sh).
      # Benchmarks (guideline 1.7): emulator numbers are trend data only. The 10% gate needs the reference device and runs there
      # through /run-perf; nothing here claims a gate verdict. androidx.benchmark aborts on an emulator without EMULATOR, and
      # NOT-AOT-COMPILED is suppressed because the CI emulator runs the app without a profile-guided AOT compile. The package
      # filter keeps a11y/e2e/vault out of the benchmark run. :benchmark (macrobenchmark) stays deferred; see its README.
      - name: Run the instrumented tests and the microbenchmarks on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notPackage=app.lensly.benchmark
            ./gradlew :app:connectedBenchmarkAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=app.lensly.benchmark -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,NOT-AOT-COMPILED

      - name: Upload the emulator test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-test-results
          path: |
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
          retention-days: 7
          if-no-files-found: ignore

  report:
    # Guideline 2.5: one issue per failing check, named for the check. A run that fails a check with an open issue comments on
    # that issue instead. This one job reads the needs results, so parallel failures cannot open several issues.
    # Only master reports: a manual run on a branch cannot restore master's dependency cache once the branch changes a Gradle file
    # (fuzz fails on that miss by design), and it checks code that is not on master, so its failures are not master's.
    needs: [build, full, screenshots, fuzz, emulator]
    if: failure() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      NEEDS: ${{ toJSON(needs) }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update one issue per failing check
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<< "$NEEDS")
          for check in $failed; do
            title="Nightly check failing: $check"
            body=$(printf 'Run: %s\nCheck: %s\n' "$RUN_URL" "$check")
            n=$(gh issue list --repo "$GH_REPO" --label area:ci --state open --limit 500 --json number,title \
                  | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -n 1)
            if [ -n "$n" ]; then
              gh issue comment "$n" --repo "$GH_REPO" --body "$body"
            else
              gh issue create --repo "$GH_REPO" --label area:ci --title "$title" --body "$body"
            fi
          done
