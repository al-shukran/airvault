name: DCO
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Read only: the check lists the pull request commits and writes no state.
#   contents: read      checkout of this workflow's own script
#   pull-requests: read read the commits of the pull request under review
permissions:
  contents: read
  pull-requests: read

# A new push to the pull request supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pull request's own copy of dco_check.py runs with a read-only token and
      # no secrets, so a pull request can only change its own DCO status; required
      # review covers that.
      - name: Check the Signed-off-by trailers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/dco_check.py
