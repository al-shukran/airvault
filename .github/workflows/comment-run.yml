name: comment-run

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: comment-run-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Read-only. This job runs before any PR code is checked out: authorization comes from the
  # comment author's repository permission, so fork code never runs on a write-capable job.
  gate:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/run-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # gh pr view --json headRefOid
    outputs:
      kind: ${{ steps.gate.outputs.kind }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Check write access and parse the command
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" \
                   --jq .permission 2>/dev/null || echo none)
          case "$perm" in
            admin|maintain|write) ;;
            *)
              echo "::error::$ACTOR has '$perm' permission; only write access may trigger /run-*."
              exit 1
              ;;
          esac

          kind=${BODY#/run-}
          kind=${kind%%[[:space:]]*}
          case "$kind" in
            instrumented|e2e|screenshot-testing|perf|security|fuzz) ;;
            *)
              echo "::error::Unknown command '/run-$kind'. Use instrumented, e2e," \
                   "screenshot-testing, perf, security, or fuzz."
              exit 1
              ;;
          esac

          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)" \
            >> "$GITHUB_OUTPUT"

  # Host layers: screenshot-testing (1.5), security (1.8), fuzz (1.8). No device needed.
  run-host:
    needs: gate
    if: contains(fromJSON('["screenshot-testing","security","fuzz"]'), needs.gate.outputs.kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # A layer that is not configured yet must fail, not skip (scripts/ci/run-extended.sh).
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run ${{ needs.gate.outputs.kind }} on the runner
        run: scripts/ci/run-extended.sh "${{ needs.gate.outputs.kind }}"

  # Emulator layers: instrumented (1.3), e2e (1.6).
  run-emulator:
    needs: gate
    if: contains(fromJSON('["instrumented","e2e"]'), needs.gate.outputs.kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run ${{ needs.gate.outputs.kind }} on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: scripts/ci/run-extended.sh ${{ needs.gate.outputs.kind }}

  # Perf (1.7) needs the reference device: the 10% gate judges only real hardware, and an
  # emulator cannot produce numbers the baseline describes. Self-hosted, label `android-ref`.
  run-device:
    needs: gate
    if: needs.gate.outputs.kind == 'perf'
    runs-on: [self-hosted, android-ref]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # No emulator step and no EMULATOR suppression: this is the phone whose numbers the
      # baseline was recorded on. Set BENCHMARK_RESULT to also run the 10% gate.
      - name: Run perf on the reference device
        run: scripts/ci/run-extended.sh perf

  # Guideline 2.6: exactly one result comment per request. Guarded so a comment failure never
  # changes the run's verdict, and skipped when the gate rejected the request.
  report:
    needs: [gate, run-host, run-emulator, run-device]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write   # post the result through the issue-comments endpoint (a PR is an issue)
    steps:
      - name: Post the result to the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          KIND: ${{ needs.gate.outputs.kind }}
          HOST: ${{ needs.run-host.result }}
          EMULATOR: ${{ needs.run-emulator.result }}
          DEVICE: ${{ needs.run-device.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$KIND" in
            screenshot-testing|security|fuzz) result="$HOST" ;;
            instrumented|e2e) result="$EMULATOR" ;;
            perf) result="$DEVICE" ;;
            *) result="unknown" ;;
          esac
          if [ "$result" = "success" ]; then mark="passed"; else mark="failed"; fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "/run-$KIND $mark ($result): $RUN_URL" \
            || echo "::warning::Could not post the result comment; the run log has the outcome."
