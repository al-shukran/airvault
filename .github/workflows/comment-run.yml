name: comment-run

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write   # read the PR head SHA in the gate step
  issues: write          # post the result through the issue-comments endpoint (a PR is an issue)

concurrency:
  group: comment-run-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  run:
    # Only pull requests, only the /run-* commands.
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/run-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A layer that is not configured yet must fail, not skip (scripts/ci/run-extended.sh).
      CI: true
    steps:
      # This step runs before any PR code is checked out. Authorization is decided from the
      # comment author's repository permission, so a fork PR never executes code with this token
      # unless a member with write access asked for the run.
      - name: Check write access and parse the command
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" \
                   --jq .permission 2>/dev/null || echo none)
          case "$perm" in
            admin|maintain|write) ;;
            *)
              echo "::error::$ACTOR has '$perm' permission; only write access may trigger /run-*."
              exit 1
              ;;
          esac

          kind=${BODY#/run-}
          kind=${kind%%[[:space:]]*}
          case "$kind" in
            instrumented|e2e|screenshot-testing|perf|security|fuzz) ;;
            *)
              echo "::error::Unknown command '/run-$kind'. Use instrumented, e2e," \
                   "screenshot-testing, perf, security, or fuzz."
              exit 1
              ;;
          esac

          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)" \
            >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Device layers: instrumented (1.3), e2e (1.6), perf (1.7).
      - name: Run ${{ steps.gate.outputs.kind }} on an emulator
        if: contains(fromJSON('["instrumented","e2e","perf"]'), steps.gate.outputs.kind)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: scripts/ci/run-extended.sh ${{ steps.gate.outputs.kind }}

      # Host layers: screenshot-testing (1.5), security (1.8), fuzz (1.8). No device needed.
      - name: Run ${{ steps.gate.outputs.kind }} on the runner
        if: contains(fromJSON('["screenshot-testing","security","fuzz"]'), steps.gate.outputs.kind)
        run: scripts/ci/run-extended.sh "${{ steps.gate.outputs.kind }}"

      # Guideline 2.6: the run reports back to the PR. Guarded so a comment failure never
      # changes the job verdict, and skipped when the gate rejected the request.
      - name: Post the result to the PR
        if: always() && steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          KIND: ${{ steps.gate.outputs.kind }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = "success" ]; then mark="passed"; else mark="failed"; fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "/run-$KIND $mark ($RESULT): $RUN_URL" \
            || echo "::warning::Could not post the result comment; the run log has the outcome."
