name: Changelog

# A reminder, not a gate. It runs on each push to master and warns when the pushed commits changed product code without a
# changelog fragment. Pull requests do not run it: the fragment check is not security or legal, so it stays off the PR budget.
# Nothing here fails a run, so a missing fragment is fixed in the next pull request.
on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'lumio/**'
      - 'shared/**'
      - 'core/**'
      - 'chains/**'
      - 'abi/**'
      - 'changelog.d/**'
      - 'CHANGELOG-lensly.md'
      - 'CHANGELOG-lumio.md'
      - 'scripts/changelog_fragments.py'
      - '.github/workflows/changelog.yml'

# Read only: the check reads the git diff of the push and the fragments on disk.
permissions:
  contents: read

jobs:
  fragments:
    name: Changelog fragments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No pull request code is run: the script is this workflow's own file, and the diff it reads is git metadata.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changelog fragments reminder
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          python3 scripts/changelog_fragments.py --check --base "$BASE_SHA" \
            || echo "::warning::A commit on master changed product code without a changelog fragment. Add one under changelog.d/ in the next pull request."
